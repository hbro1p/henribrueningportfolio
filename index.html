  if (path.length){
    $('#crumb .cur').innerHTML = path.map((id,i)=>
      i === path.length-1
        ? '<span>'+esc(folderById[id].name)+'</span>'
        : '<button data-up="'+i+'">'+esc(folderById[id].name)+'</button>'
    ).join(' <span class="sep">/</span> ');
    $('#crumb .cur').querySelectorAll('[data-up]').forEach(b=>{
      b.addEventListener('click', ()=> goPath(path.slice(0, +b.dataset.up + 1)));
    });
  }
}

function goPath(next){
  path = next; closeWin();
  if (typeof closeTV === 'function') closeTV();
  if (typeof closePhoto === 'function') closePhoto();
  path.length ? S.goFolder(level()) : S.goRoot();
  setCrumb();
  history.replaceState(null,'', path.length ? '#'+level() : ' ');
  // a folder that holds exactly one file opens straight into that file
  if (path.length){
    const f = folderById[level()];
    const solo = ITEMS.filter(i=> i.f === level());
    if (f && !(f.subs && f.subs.length) && solo.length === 1){
      const only = solo[0].id;
      setTimeout(()=>{ if (level() === f.id && !openId) openWin(only); }, 560);
    }
  }
}
function goRoot(){ goPath([]); }
function goUp(){ goPath(path.slice(0,-1)); }
function goFolder(id){
  const f = folderById[id]; if (!f) return;
  goPath(f.parent ? [f.parent, id] : [id]);
}
function pathTo(id){
  const f = folderById[id];
  return f ? (f.parent ? [f.parent, id] : [id]) : [];
}

S.openFolder = goFolder;
S.openItem   = openWin;
S.back       = goUp;
$('#back').addEventListener('click', goUp);

/* ---------- the window ---------- */
const win = $('#win'), body = $('#winBody');

function openWin(id){
  const d = byId[id]; if (!d) return;
  // a photograph belongs in the viewer, not in a window full of headings
  if (d.f === 'photos' && d.img && openPhoto(id)) return;
  if (level() !== d.f) { path = pathTo(d.f); S.goFolder(d.f); setCrumb(); }
  openId = id;
  const fol = folderById[d.f];
  $('#winName').textContent = fol.name + '  /  ' + d.title;
  win.style.setProperty('--accent', fol.color || '#ffffff');

  let h = '';
  if (d.img) h += '<figure class="shot"><img src="'+d.img+'" alt="'+esc(d.alt||d.title)+'" loading="lazy"></figure>';
  h += '<h2>'+esc(d.title)+'</h2>';
  if (d.role) h += '<div class="role">'+esc(d.role)+'</div>';
  if (d.metric) h += '<div class="big"><b>'+esc(d.metric[0])+'</b>'+(d.metric[1]?'<span>'+esc(d.metric[1])+'</span>':'')+'</div>';
  h += (d.body||'').split('\n\n').filter(Boolean).map(p=>'<p>'+esc(p)+'</p>').join('');
  if (d.did && d.did.length){
    h += '<h3>'+esc(d.didTitle || t('whatIDid'))+'</h3><ul>'+d.did.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
  }
  if (d.extra && d.extra.body){
    h += '<h3>'+esc(d.extra.title||'More')+'</h3>'
       + d.extra.body.split('\n\n').filter(Boolean).map(p=>'<p class="ex">'+esc(p)+'</p>').join('');
  }
  if (d.quote){
    h += '<blockquote><div class="t">&ldquo;'+esc(d.quote.t)+'&rdquo;</div>'
       + (d.quote.a ? '<div class="a">— '+esc(d.quote.a)+'</div>' : '') + '</blockquote>';
  }
  if (d.links && d.links.length){
    h += '<h3>'+esc(t('links'))+'</h3><div class="links">'+d.links
      .map(l=>'<a href="'+l.u+'" target="_blank" rel="noopener"><span>'+esc(l.t)+'</span>'+EXT+'</a>').join('')+'</div>';
  }
  if (d.tags && d.tags.length){
    h += '<div class="tags">'+d.tags.map(t=>'<span>'+esc(t)+'</span>').join('')+'</div>';
  }
  body.innerHTML = h;
  body.scrollTop = 0;

  const sibs = ITEMS.filter(i=> i.f === d.f);
  const idx = sibs.findIndex(i=> i.id === id);
  $('#winNav .pos').textContent = (idx+1) + ' / ' + sibs.length;
  $('#winNav').style.display = sibs.length > 1 ? '' : 'none';

  document.body.classList.add('window');
  win.setAttribute('aria-hidden','false');
  history.replaceState(null,'','#'+id);
  S.clearHover();
  win.focus({preventScroll:true});
}

function closeWin(){
  if (!openId) return;
  openId = null;
  document.body.classList.remove('window');
  win.setAttribute('aria-hidden','true');
  history.replaceState(null,'', path.length ? '#'+level() : ' ');
}

function step(dir){
  if (!openId) return;
  const d = byId[openId];
  const sibs = ITEMS.filter(i=> i.f === d.f);
  const idx = sibs.findIndex(i=> i.id === openId);
  openWin(sibs[(idx + dir + sibs.length) % sibs.length].id);
}

$('#winClose').addEventListener('click', closeWin);
$('#veil').addEventListener('click', closeWin);
$('#winPrev').addEventListener('click', ()=> step(-1));
$('#winNext').addEventListener('click', ()=> step(1));

document.addEventListener('keydown', e=>{
  if (document.body.classList.contains('pv')){
    if (e.key === 'Escape'){ closePhoto(); return; }
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown'){ e.preventDefault(); showPhoto(pvIdx+1); return; }
    if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp'){   e.preventDefault(); showPhoto(pvIdx-1); return; }
    return;
  }
  if (document.body.classList.contains('tv')){
    if (e.key === 'Escape'){ closeTV(); return; }
    if (e.key === ' ' || e.key === 'k'){ e.preventDefault(); toggle(); return; }
    if (e.key === 'ArrowRight'){ e.preventDefault(); seekBy(10); return; }
    if (e.key === 'ArrowLeft'){  e.preventDefault(); seekBy(-10); return; }
    if (e.key === 'ArrowDown' || e.key === 'n'){ e.preventDefault(); playVideo(tvIdx+1); return; }
    if (e.key === 'ArrowUp'   || e.key === 'p'){ e.preventDefault(); playVideo(tvIdx-1); return; }
    if (e.key === 'm'){ $('#tvMute').click(); return; }
    return;
  }
  if (e.key === 'Escape'){ openId ? closeWin() : (path.length && goUp()); }
  if (!openId) return;
  if (e.key === 'ArrowRight'){ e.preventDefault(); step(1); }
  if (e.key === 'ArrowLeft'){  e.preventDefault(); step(-1); }
});

/* ---------- language ---------- */
function paintUI(){
  $('#back').lastChild.textContent = t('back');
  $('#say').textContent = t('sayHello');
  $('#winPrev').textContent = '\u2190 ' + t('prev');
  $('#winNext').textContent = t('next') + ' \u2192';
  $('#langnow').textContent = (LANGS.find(l=> l.id === LANG) || LANGS[0]).short;
  $('#tvnoteText').textContent = t('tvNote');
  $('#tvopen').textContent = t('tvOpen') + ' \u2197';
  $('#tvclose').setAttribute('aria-label', t('close'));
  $('#tvPrev').setAttribute('aria-label', t('prevVideo'));
  $('#tvNext').setAttribute('aria-label', t('nextVideo'));
  $('#tvedgePrev').setAttribute('aria-label', t('prevVideo'));
  $('#tvedgeNext').setAttribute('aria-label', t('nextVideo'));
  $('#tvBack10').setAttribute('aria-label', t('back10'));
  $('#tvFwd10').setAttribute('aria-label', t('fwd10'));
  $('#langbtn').setAttribute('aria-label', t('language'));
  $('#langmenu').innerHTML = LANGS.map(l=>
    '<button role="menuitem" data-l="'+l.id+'" aria-current="'+(l.id===LANG)+'">'
    + '<span class="k">'+l.short+'</span><span>'+esc(l.name)+'</span></button>').join('');
  $('#langmenu').querySelectorAll('button').forEach(b=>
    b.addEventListener('click', ()=>{ chooseLang(b.dataset.l); }));
}

function chooseLang(id){
  if (id === LANG) { closeLangMenu(); return; }
  setLang(id);
  paintUI();
  setCrumb();
  syncPlayerLabels();
  if (openId) openWin(openId);        // redraw the open window in the new language
  closeLangMenu();
}
function openLangMenu(){ $('#langmenu').hidden = false; $('#langbtn').setAttribute('aria-expanded','true'); }
function closeLangMenu(){ $('#langmenu').hidden = true; $('#langbtn').setAttribute('aria-expanded','false'); }
$('#langbtn').addEventListener('click', e=>{
  e.stopPropagation();
  $('#langmenu').hidden ? openLangMenu() : closeLangMenu();
});
document.addEventListener('click', e=>{
  if (!$('#langwrap').contains(e.target)) closeLangMenu();
});

/* ---------- one photograph, fullscreen ---------- */
const pvWrap = $('#pvwrap'), pvBox = $('#pvbox'), pvImg = $('#pvimg');
let pvList = [], pvIdx = 0;

function photoItems(){ return ITEMS.filter(i=> i.f === 'photos' && i.img); }

function showPhoto(i){
  if (!pvList.length) return;
  pvIdx = (i + pvList.length) % pvList.length;
  const d = pvList[pvIdx];
  pvImg.classList.remove('on');
  const done = ()=> pvImg.classList.add('on');
  pvImg.onload = done;
  pvImg.src = d.img;
  if (pvImg.complete) done();
  pvImg.alt = d.alt || d.title || 'Photo';
  $('#pvcount').textContent = (pvIdx+1) + ' / ' + pvList.length;
  $('#pvname').textContent = folderById.photos ? folderById.photos.name : '';
  const cap = [d.title, d.role].filter(Boolean).join('  ·  ');
  $('#pvcap').textContent = cap;
  // keep the next one warm so paging feels instant
  const nxt = pvList[(pvIdx+1) % pvList.length];
  if (nxt && nxt.img){ const pre = new Image(); pre.src = nxt.img; }
}

function openPhoto(id){
  pvList = photoItems();
  const at = pvList.findIndex(p=> p.id === id);
  if (at < 0) return false;
  closeWin();
  document.body.classList.add('pv');
  pvWrap.setAttribute('aria-hidden','false');
  showPhoto(at);
  S.clearHover();
  pvBox.focus({preventScroll:true});
  return true;
}
function closePhoto(){
  if (!document.body.classList.contains('pv')) return;
  document.body.classList.remove('pv');
  pvWrap.setAttribute('aria-hidden','true');
  pvImg.classList.remove('on');
  pvImg.removeAttribute('src');
}
$('#pvclose').addEventListener('click', closePhoto);
$('#pvPrev').addEventListener('click', ()=> showPhoto(pvIdx-1));
$('#pvNext').addEventListener('click', ()=> showPhoto(pvIdx+1));

/* swipe through the photographs */
(function pvSwipe(){
  const st = $('#pvstage');
  let sx=0, sy=0, t0=0, on=false;
  st.addEventListener('pointerdown', e=>{ on=true; sx=e.clientX; sy=e.clientY; t0=Date.now(); });
  st.addEventListener('pointerup', e=>{
    if (!on) return; on=false;
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)){ showPhoto(pvIdx + (dx<0 ? 1 : -1)); return; }
    if (dy > 90 && Math.abs(dy) > Math.abs(dx)){ closePhoto(); return; }   // swipe down to close
    if (Math.abs(dy) > 55 && Math.abs(dy) > Math.abs(dx)){ showPhoto(pvIdx + (dy<0 ? 1 : -1)); }
  });
  st.addEventListener('pointercancel', ()=>{ on=false; });
})();

/* ---------- the television ---------- */
const tvWrap = $('#tvwrap'), tvBox = $('#tvbox'), tvScreen = $('#tvscreen');
let tvIdx = 0, tvTimer = 0, tvVid = null, tvHide = 0, tvMuted = false;

const mmss = s => {
  if (!isFinite(s) || s < 0) s = 0;
  const m = Math.floor(s/60), x = Math.floor(s%60);
  return m + ':' + String(x).padStart(2,'0');
};

function showUI(){
  document.body.classList.add('tvui');
  clearTimeout(tvHide);
  tvHide = setTimeout(()=>{
    if (tvVid && !tvVid.paused) document.body.classList.remove('tvui');
  }, 2800);
}

function syncPlayerLabels(){
  $('#tvname').textContent = t('allVideos');
  const v = VIDEOS[tvIdx];
  if (v && v.who) $('#tvname').textContent = t('allVideos') + '  /  ' + v.who;
  $('#tvcount').textContent = (tvIdx+1) + ' / ' + VIDEOS.length;
}

function setPlayIcon(paused){
  $('#tvIconPlay').hidden = !paused;
  $('#tvIconPause').hidden = paused;
  $('#tvPlay').setAttribute('aria-label', paused ? t('play') : t('pause'));
  document.body.classList.toggle('tvpaused', !!paused);
}

function playVideo(i){
  tvIdx = (i + VIDEOS.length) % VIDEOS.length;
  const v = VIDEOS[tvIdx];
  document.body.classList.remove('tvblocked');
  clearTimeout(tvTimer);
  stopMedia();

  if (v.file){
    document.body.classList.remove('tvembed');
    const el = document.createElement('video');
    el.setAttribute('playsinline','');
    el.setAttribute('preload','metadata');
    el.muted = tvMuted;
    if (v.poster) el.poster = v.poster;
    el.src = v.file;
    tvVid = el;

    el.addEventListener('loadedmetadata', paintTime);
    el.addEventListener('timeupdate', paintTime);
    el.addEventListener('progress', paintTime);
    el.addEventListener('play',  ()=>{ setPlayIcon(false); showUI(); });
    el.addEventListener('pause', ()=>{ setPlayIcon(true); showUI(); });
    el.addEventListener('ended', ()=> playVideo(tvIdx+1));

    tvScreen.appendChild(el);
    setPlayIcon(true);
    el.play().catch(()=>{});          // a browser may refuse until the user taps
    $('#tvopen').href = v.u || v.file;
  } else {
    // an embed we do not own: no timeline, no play button, just the picture
    document.body.classList.add('tvembed');
    const fr = document.createElement('iframe');
    fr.setAttribute('allow','autoplay; encrypted-media; picture-in-picture; fullscreen');
    fr.setAttribute('allowfullscreen','');
    fr.setAttribute('referrerpolicy','origin-when-cross-origin');
    fr.setAttribute('scrolling','no');
    fr.title = v.t || '';
    let loaded = false;
    fr.addEventListener('load', ()=>{ loaded = true; });
    fr.src = v.e;
    tvScreen.appendChild(fr);
    tvTimer = setTimeout(()=>{ if (!loaded) document.body.classList.add('tvblocked'); }, 3200);
    $('#tvopen').href = v.u;
  }
  paintTime();
  syncPlayerLabels();
  showUI();
}

function stopMedia(){
  tvScreen.querySelectorAll('iframe,video').forEach(n=>{
    if (n.tagName === 'VIDEO'){ try{ n.pause(); }catch(e){} n.removeAttribute('src'); n.load(); }
    n.remove();
  });
  tvVid = null;
}

function paintTime(){
  const v = tvVid;
  const dur = v && isFinite(v.duration) ? v.duration : 0;
  const cur = v ? v.currentTime : 0;
  $('#tvcur').textContent = mmss(cur);
  $('#tvdur').textContent = mmss(dur);
  const pct = dur ? (cur/dur)*100 : 0;
  $('#tvfill').style.width = pct + '%';
  $('#tvknob').style.left  = pct + '%';
  let buf = 0;
  if (v && v.buffered && v.buffered.length) { try{ buf = v.buffered.end(v.buffered.length-1); }catch(e){} }
  $('#tvbuf').style.width = (dur ? (buf/dur)*100 : 0) + '%';
}

function toggle(){
  if (!tvVid) return;
  tvVid.paused ? tvVid.play().catch(()=>{}) : tvVid.pause();
  showUI();
}
function seekBy(sec){
  if (!tvVid) return;
  const dur = isFinite(tvVid.duration) && tvVid.duration > 0 ? tvVid.duration : Infinity;
  tvVid.currentTime = Math.max(0, Math.min(dur - 0.05, tvVid.currentTime + sec));
  showUI();
}

/* ---------- the timeline, draggable ---------- */
(function scrub(){
  const line = $('#tvline'), track = $('#tvtrack');
  let dragging = false;
  const at = x =>{
    const r = track.getBoundingClientRect();
    return Math.max(0, Math.min(1, (x - r.left) / (r.width || 1)));
  };
  const put = x =>{
    if (!tvVid || !isFinite(tvVid.duration)) return;
    tvVid.currentTime = at(x) * tvVid.duration;
    paintTime();
  };
  line.addEventListener('pointerdown', e=>{
    if (!tvVid) return;
    dragging = true; line.classList.add('drag');
    line.setPointerCapture(e.pointerId); put(e.clientX); showUI();
  });
  line.addEventListener('pointermove', e=>{ if (dragging) put(e.clientX); });
  const stop = ()=>{ dragging = false; line.classList.remove('drag'); };
  line.addEventListener('pointerup', stop);
  line.addEventListener('pointercancel', stop);
})();

/* ---------- swipe to change video, tap to play ---------- */
(function swipe(){
  const stage = $('#tvstage');
  let sx=0, sy=0, st=0, on=false;
  stage.addEventListener('pointerdown', e=>{ on=true; sx=e.clientX; sy=e.clientY; st=Date.now(); });
  stage.addEventListener('pointerup', e=>{
    if (!on) return; on=false;
    const dx = e.clientX-sx, dy = e.clientY-sy, dt = Date.now()-st;
    if (Math.abs(dy) > 55 && Math.abs(dy) > Math.abs(dx)*1.2){ playVideo(tvIdx + (dy < 0 ? 1 : -1)); return; }
    if (Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy)*1.2){ playVideo(tvIdx + (dx < 0 ? 1 : -1)); return; }
    if (dt < 400 && Math.abs(dx) < 12 && Math.abs(dy) < 12){
      if (document.body.classList.contains('tvui') || !tvVid || tvVid.paused) toggle(); else showUI();
    }
  });
  stage.addEventListener('pointercancel', ()=>{ on=false; });
  stage.addEventListener('pointermove', ()=>{ if (!on) showUI(); });
})();

function openTV(){
  if (!path.length || level() !== 'social'){ path = ['social']; S.goFolder('social'); setCrumb(); }
  closeWin();
  document.body.classList.add('tv');
  tvWrap.setAttribute('aria-hidden','false');
  playVideo(tvIdx);
  S.clearHover();
  tvBox.focus({preventScroll:true});
}
function closeTV(){
  if (!document.body.classList.contains('tv')) return;
  document.body.classList.remove('tv','tvblocked','tvembed','tvui','tvpaused');
  tvWrap.setAttribute('aria-hidden','true');
  clearTimeout(tvTimer); clearTimeout(tvHide);
  stopMedia();
}
S.openTV = openTV;

$('#tvclose').addEventListener('click', closeTV);
$('#tvPlay').addEventListener('click', toggle);
$('#tvtap').addEventListener('click', toggle);
$('#tvBack10').addEventListener('click', ()=> seekBy(-10));
$('#tvFwd10').addEventListener('click', ()=> seekBy(10));
$('#tvPrev').addEventListener('click', ()=> playVideo(tvIdx-1));
$('#tvNext').addEventListener('click', ()=> playVideo(tvIdx+1));
$('#tvedgePrev').addEventListener('click', ()=> playVideo(tvIdx-1));
$('#tvedgeNext').addEventListener('click', ()=> playVideo(tvIdx+1));
$('#tvMute').addEventListener('click', ()=>{
  tvMuted = !tvMuted;
  if (tvVid) tvVid.muted = tvMuted;
  $('#tvIconLoud').hidden = tvMuted;
  $('#tvIconMute').hidden = !tvMuted;
  $('#tvMute').setAttribute('aria-label', tvMuted ? t('unmute') : t('mute'));
  showUI();
});

/* ---------- deep links ---------- *//* ---------- deep links ---------- */
(function start(){
  paintUI();
  setCrumb();
  const h = (location.hash||'').replace('#','');
  if (byId[h]) setTimeout(()=> openWin(h), 700);
  else if (folderById[h]) setTimeout(()=> goFolder(h), 500);
})();
}

/* ===================== MEDIA + BOOT =====================
   Photos and videos are not baked into this file. They live next to it,
   listed in media.json, so you can add or swap them without touching the code.

   media.json:
   {
     "photos": [ { "file": "img/photo-01.jpg", "caption": "…", "where": "…" } ],
     "videos": [ { "file": "video/video-01.mp4", "poster": "video/video-01.jpg",
                   "title": "…", "who": "…" } ]
   }
   Missing file, empty lists or no server — the page simply falls back to what
   is written in the data above, so it never breaks.
*/
function applyMedia(m){
  if (!m || typeof m !== 'object') return;

  /* ---- photos ---- */
  const ph = Array.isArray(m.photos) ? m.photos.filter(p=> p && p.file) : [];
  if (ph.length){
    for (let i = ITEMS.length-1; i >= 0; i--) if (ITEMS[i].f === 'photos') ITEMS.splice(i,1);
    ph.forEach((p,i)=>{
      ITEMS.push({
        f:'photos',
        id:'photo-' + String(i+1).padStart(2,'0'),
        title: p.caption || '',
        role: p.where || '',
        body: p.text || '',
        img: p.file,
        ar: (p.w && p.h) ? p.w/p.h : 0,      // the picture's own shape
        alt: p.caption || 'Photo'
      });
    });
  }

  /* ---- videos ---- */
  const vd = Array.isArray(m.videos) ? m.videos.filter(v=> v && (v.file || v.e)) : [];
  if (vd.length){
    VIDEOS.length = 0;
    vd.forEach((v,i)=> VIDEOS.push({
      t: v.title || ('Video ' + (i+1)),
      who: v.who || '',
      file: v.file || '',
      poster: v.poster || '',
      u: v.u || v.file || '',
      e: v.e || ''
    }));
  }
}

(async function boot(){
  // The scene must never wait on the network. If media.json is slow, missing or
  // behind a bad connection, the page still comes up immediately with what is
  // written in this file, and the photos slot in when they arrive.
  let booted = false;
  const start = ()=>{ if (booted) return; booted = true; BOOT_SPACE(); BOOT_UI(); };

  const media = (async()=>{
    try{
      const r = await fetch('media.json', { cache:'no-store' });
      if (r.ok) return await r.json();
    }catch(e){}
    return null;
  })();

  const quick = await Promise.race([ media, new Promise(r=> setTimeout(()=> r('timeout'), 1200)) ]);
  if (quick && quick !== 'timeout'){ applyMedia(quick); start(); return; }

  start();                                  // up and running, no waiting
  const late = await media;                 // ...and fold the photos in after
  if (late){
    applyMedia(late);
    if (typeof applyLang === 'function') applyLang();
    if (window.SPACE && SPACE.refresh) SPACE.refresh();
  }
})();
