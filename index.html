<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Henri Bruening - portfolio. Video, media, web and projects from Coesfeld.">
<meta name="theme-color" content="#000206">
<meta property="og:title" content="Henri Bruening - Portfolio">
<meta property="og:description" content="Video, media, web and projects.">
<meta property="og:type" content="website">
<title>Henri Brüning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- The webfont must never hold up the first paint. A plain stylesheet link in
     the head is render-blocking: on a slow mobile connection the whole page sits
     empty until Google answers. Loaded as "print" it does not block, and the
     onload swap applies it the moment it lands. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap"></noscript>
<style>
:root{
  color-scheme: dark;
  --bg:#000206;
  --ink:#ffffff;
  --dim:#c3cad4;
  --faint:#8b93a0;
  --line:rgba(255,255,255,.30);
  --hair:rgba(255,255,255,.08);
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Archivo','Helvetica Neue',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--sans);overflow:hidden;overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
a{color:inherit}
:focus-visible{outline:1px solid #fff;outline-offset:3px}

#sky{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}
#sky.drag{cursor:grabbing}
#sky.point{cursor:pointer}
#folderLabels{position:fixed;inset:0;z-index:4;pointer-events:none}
.folder-label{
  position:absolute;left:0;top:0;transform:translate(-50%,0);
  width:150px;text-align:center;text-transform:uppercase;
  font-family:var(--mono);line-height:1.45;
  text-rendering:geometricPrecision;-webkit-font-smoothing:antialiased;
  opacity:0;will-change:transform,opacity;
}
.folder-label .name{
  display:block;color:#fff;font-weight:500;letter-spacing:.16em;
  text-wrap:balance;
}
.folder-label .count{
  display:block;margin-top:5px;font-weight:500;letter-spacing:.18em;
}
@media (min-width:860px){#folderLabels{display:none}}

/* ---------- title, only on the root level ---------- */
#title{
  position:fixed;left:0;right:0;top:clamp(34px,7vh,72px);z-index:5;
  text-align:center;pointer-events:none;padding-inline:20px;
  transition:opacity .5s ease, transform .5s ease;
}
body.deep #title{opacity:0;transform:translateY(-12px)}
#title h1{
  font-family:var(--sans);font-weight:700;font-size:clamp(20px,2.5vw,30px);
  letter-spacing:.12em;margin:0;line-height:1.2;
}
#title .pf{
  font-family:var(--sans);font-weight:700;font-size:clamp(12px,1.5vw,18px);
  letter-spacing:.34em;margin-top:10px;color:#fff;line-height:1.2;
}
#social{
  display:flex;justify-content:center;gap:clamp(16px,2vw,24px);margin-top:20px;
  pointer-events:auto;
}
#social a{
  display:grid;place-items:center;width:34px;height:34px;color:#fff;opacity:.95;
  transition:opacity .2s, transform .2s;
}
#social a:hover{opacity:1;transform:translateY(-2px)}
#social svg{
  width:21px;height:21px;stroke:currentColor;fill:none;
  stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;
}

/* ---------- breadcrumb + back ---------- */
#crumb{
  position:fixed;top:26px;left:26px;z-index:6;display:flex;align-items:center;gap:11px;
  font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  opacity:0;transform:translateX(-8px);transition:opacity .4s ease, transform .4s ease;
  pointer-events:none;
}
body.deep #crumb{opacity:1;transform:none;pointer-events:auto}
#crumb button{color:var(--dim);letter-spacing:.2em;transition:color .2s}
#crumb button:hover{color:#fff}
#crumb .sep{color:var(--faint)}
#crumb .cur{color:#fff;display:inline-flex;align-items:center;gap:11px}
#crumb .cur button{color:var(--dim)}
#crumb .cur button:hover{color:#fff}
#back{
  display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:99px;
  padding:8px 14px 8px 11px;color:var(--dim);transition:.2s
}
#back:hover{border-color:#fff;color:#fff}
#back svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- persistent contact ---------- */
#say{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
  border:1px solid var(--line);border-radius:99px;padding:10px 17px;color:var(--dim);
  text-decoration:none;transition:.2s;background:rgba(0,2,6,.5);backdrop-filter:blur(8px)
}
#say:hover{border-color:#fff;color:#fff}


/* ---------- the window that opens in space ---------- */
#win:focus{outline:none}
#win{
  position:fixed;z-index:20;left:50%;top:50%;
  width:min(680px,92vw);max-height:min(82vh,820px);
  transform:translate(-50%,-50%) scale(.94);opacity:0;pointer-events:none;
  transition:opacity .38s ease, transform .38s cubic-bezier(.16,1,.3,1);
  display:flex;flex-direction:column;
  background:rgba(2,4,9,.93);backdrop-filter:blur(20px);
  border:1px solid var(--line);border-radius:3px;
  box-shadow:0 0 0 1px rgba(0,0,0,.6), 0 40px 120px -30px rgba(0,0,0,.95);
}
body.window #win{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
#winBar{
  display:flex;align-items:center;gap:12px;padding:12px 14px;
  border-bottom:1px solid var(--hair);flex:none
}
#winBar .dots{display:flex;gap:6px;flex:none}
#winBar .dots i{width:8px;height:8px;border-radius:50%;border:1px solid var(--line);display:block}
#winBar .dots i:first-child{border-color:var(--accent,rgba(255,255,255,.16))}
#winName{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--faint);
  text-transform:uppercase;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
#winClose{width:22px;height:22px;display:grid;place-items:center;color:var(--faint);flex:none;transition:color .2s}
#winClose:hover{color:#fff}
#winClose svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
#winBody{
  overflow-y:auto;padding:30px 34px 38px;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent
}
#winBody::-webkit-scrollbar{width:5px}
#winBody::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18)}

#winBody .shot{margin:0 0 26px;border:1px solid var(--hair);background:#04070d;line-height:0}
#winBody .shot img{width:100%;height:auto;display:block;max-width:100%}
#winBody h2{
  font-family:var(--sans);font-weight:700;font-size:clamp(21px,2.6vw,27px);
  letter-spacing:-.015em;margin:0;line-height:1.14;text-wrap:balance
}
#winBody .role{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--dim);
  margin-top:11px;line-height:1.65
}
#winBody .big{
  margin-top:26px;padding-top:22px;border-top:1px solid var(--hair);
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap
}
#winBody .big b{font-family:var(--sans);font-weight:700;font-size:clamp(28px,3.6vw,40px);
  letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent,#fff)}
#winBody .big span{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
  color:var(--faint);text-transform:uppercase;line-height:1.6;max-width:26ch}
#winBody p{font-size:15px;line-height:1.75;color:#cbd2dc;margin:22px 0 0;max-width:62ch}
#winBody h3{
  font-family:var(--mono);font-size:9px;letter-spacing:.28em;color:var(--faint);
  text-transform:uppercase;margin:34px 0 14px;font-weight:400
}
#winBody ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:11px}
#winBody li{
  font-size:14px;line-height:1.6;color:#cbd2dc;padding-left:20px;position:relative;max-width:62ch
}
#winBody li::before{
  content:'';position:absolute;left:2px;top:.62em;width:7px;height:1px;background:var(--accent,#9aa2ad);opacity:.75
}
#winBody blockquote{
  margin:30px 0 0;padding:0 0 0 18px;border-left:1px solid var(--line)
}
#winBody blockquote .t{font-size:15px;line-height:1.66;font-style:italic;color:#e3e8ef}
#winBody blockquote .a{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--faint);margin-top:10px}
#winBody .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:30px}
#winBody .tags span{
  font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;color:var(--faint);
  border:1px solid var(--hair);padding:4px 8px
}
#winBody .links{display:flex;flex-direction:column;margin-top:16px;border-top:1px solid var(--hair)}
#winBody .links a{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:13px 2px;border-bottom:1px solid var(--hair);text-decoration:none;
  font-family:var(--mono);font-size:11.5px;letter-spacing:.03em;color:#cbd2dc;transition:color .2s,padding-left .2s
}
#winBody .links a:hover{color:var(--accent,#fff);padding-left:8px}
#winBody .links svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.5;opacity:.5;flex:none}

#winNav{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 14px;border-top:1px solid var(--hair);flex:none;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase
}
#winNav button{color:var(--faint);transition:color .2s;padding:4px 0}
#winNav button:hover{color:#fff}
#winNav .pos{color:var(--faint);font-variant-numeric:tabular-nums}

#veil{
  position:fixed;left:0;right:0;top:0;height:var(--vvh,100%);z-index:15;background:rgba(0,1,4,.55);
  opacity:0;pointer-events:none;transition:opacity .38s ease
}
body.window #veil{opacity:1;pointer-events:auto}

/* ---------- the television, opened fullscreen ---------- */
#tvwrap{position:fixed;left:0;right:0;top:0;height:var(--vvh,100%);z-index:30;pointer-events:none;opacity:0;transition:opacity .32s ease}
body.tv #tvwrap{pointer-events:auto;opacity:1}
#tvbox{
  position:absolute;inset:0;display:flex;flex-direction:column;
  background:#000206;transform:scale(1.03);transition:transform .38s cubic-bezier(.16,1,.3,1);
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)
}
body.tv #tvbox{transform:none}
#tvbox:focus{outline:none}

#tvtop{
  flex:none;display:flex;align-items:center;gap:14px;padding:12px 16px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)
}
#tvclose{width:38px;height:38px;margin-left:-9px;display:grid;place-items:center;color:var(--dim);flex:none;transition:color .2s}
#tvclose:hover{color:#fff}
#tvclose svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round}
#tvname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim)}
#tvcount{flex:none;font-variant-numeric:tabular-nums}

#tvstage{
  flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;
  overflow:hidden;touch-action:pan-y
}
#tvscreen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#tvscreen video{max-width:100%;max-height:100%;width:auto;height:100%;display:block;background:#000206;object-fit:contain}
#tvscreen iframe{height:100%;width:auto;aspect-ratio:.62;max-width:100%;border:0;display:block;background:#04070d}
/* the whole picture is the play/pause target on a phone */
#tvtap{position:absolute;inset:0;background:none;cursor:pointer}
body.tvembed #tvtap{display:none}

#tvbig{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.88);
  width:76px;height:76px;border-radius:50%;display:grid;place-items:center;pointer-events:none;
  background:rgba(0,2,6,.55);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.22);
  opacity:0;transition:opacity .25s ease, transform .25s ease
}
body.tvpaused #tvbig{opacity:1;transform:translate(-50%,-50%) scale(1)}
body.tvembed #tvbig{display:none}
#tvbig svg{width:30px;height:30px;fill:#fff;stroke:none;margin-left:3px}

#tvnote{
  position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;text-align:center;padding:28px;background:#04070d
}
body.tvblocked #tvnote{display:flex}
#tvnote p{font-size:14px;line-height:1.65;color:var(--dim);margin:0;max-width:32ch}
#tvopen{
  font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  border:1px solid var(--line);border-radius:99px;padding:12px 20px;color:#fff;text-decoration:none;transition:.2s
}
#tvopen:hover{border-color:#3D8BFF;color:#3D8BFF}

.tvedge{
  position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;
  display:grid;place-items:center;color:#fff;opacity:0;transition:opacity .25s ease, background .2s;
  background:rgba(0,2,6,.5);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.16)
}
#tvedgePrev{left:14px} #tvedgeNext{right:14px}
body.tvui .tvedge{opacity:.85}
.tvedge:hover{background:rgba(0,2,6,.85);opacity:1}
.tvedge svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
@media (hover:none){ .tvedge{display:none} }

#tvctl{
  flex:none;padding:10px 16px calc(16px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:2px;
  opacity:0;transform:translateY(8px);transition:opacity .25s ease, transform .25s ease
}
body.tvui #tvctl{opacity:1;transform:none}
body.tvembed #tvctl{display:none}

#tvline{padding:14px 0 6px;cursor:pointer;touch-action:none}
#tvtrack{position:relative;height:3px;border-radius:2px;background:rgba(255,255,255,.16)}
#tvbuf{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.22);border-radius:2px}
#tvfill{position:absolute;left:0;top:0;bottom:0;width:0;background:#3D8BFF;border-radius:2px}
#tvknob{
  position:absolute;top:50%;left:0;width:13px;height:13px;margin-left:-6.5px;border-radius:50%;
  background:#fff;transform:translateY(-50%) scale(.85);transition:transform .16s ease;display:block
}
#tvline:hover #tvknob, #tvline.drag #tvknob{transform:translateY(-50%) scale(1.15)}

#tvtimes{
  display:flex;justify-content:space-between;
  font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--faint);font-variant-numeric:tabular-nums
}
#tvbtns{display:flex;align-items:center;justify-content:center;gap:clamp(10px,4vw,28px);margin-top:8px}
#tvbtns button{
  position:relative;width:48px;height:48px;display:grid;place-items:center;color:var(--dim);
  border-radius:50%;transition:color .2s, background .2s
}
#tvbtns button:hover{color:#fff;background:rgba(255,255,255,.07)}
#tvbtns svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* the UA [hidden] rule does not reach SVG elements — say it explicitly */
#tvbtns svg[hidden]{display:none}
#tvbtns svg .fill{fill:currentColor;stroke:none}
#tvPlay{color:#fff}
#tvPlay svg{width:28px;height:28px}
#tvBack10 b, #tvFwd10 b{
  position:absolute;left:0;right:0;top:53%;transform:translateY(-50%);
  font-family:var(--mono);font-size:8px;font-weight:500;letter-spacing:0;text-align:center;pointer-events:none
}

/* ---------- one photograph, fullscreen ---------- */
#pvwrap{position:fixed;left:0;right:0;top:0;height:var(--vvh,100%);z-index:32;
  pointer-events:none;opacity:0;transition:opacity .3s ease}
body.pv #pvwrap{pointer-events:auto;opacity:1}
#pvbox{
  position:absolute;inset:0;display:flex;flex-direction:column;background:#000206;
  transform:scale(1.02);transition:transform .34s cubic-bezier(.16,1,.3,1);
  padding-top:env(safe-area-inset-top)
}
body.pv #pvbox{transform:none}
#pvbox:focus{outline:none}
#pvtop{
  flex:none;display:flex;align-items:center;gap:14px;padding:12px 16px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)
}
#pvclose{width:38px;height:38px;margin-left:-9px;display:grid;place-items:center;color:var(--dim);flex:none;transition:color .2s}
#pvclose:hover{color:#fff}
#pvclose svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round}
#pvname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim)}
#pvcount{flex:none;font-variant-numeric:tabular-nums}
#pvstage{
  flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;
  padding:4px 10px;touch-action:pan-y;overflow:hidden
}
#pvimg{
  max-width:100%;max-height:100%;width:auto;height:auto;display:block;
  opacity:0;transition:opacity .25s ease;user-select:none;-webkit-user-drag:none
}
#pvimg.on{opacity:1}
.pvedge{
  position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;
  display:grid;place-items:center;color:#fff;opacity:.8;transition:opacity .2s, background .2s;
  background:rgba(0,2,6,.5);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.18)
}
#pvPrev{left:14px} #pvNext{right:14px}
.pvedge:hover{background:rgba(0,2,6,.85);opacity:1}
.pvedge svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
@media (hover:none){ .pvedge{display:none} }
#pvfoot{
  flex:none;min-height:34px;padding:6px 16px calc(14px + env(safe-area-inset-bottom));
  display:flex;align-items:center;justify-content:center;text-align:center
}
#pvcap{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}

/* ---------- the corner: language and contact ---------- */
#corner{
  position:fixed;left:0;right:0;top:0;height:var(--vvh,100%);
  z-index:6;pointer-events:none
}
#cornerIn{
  position:absolute;right:26px;bottom:26px;
  display:flex;align-items:center;gap:10px;pointer-events:auto
}
#langwrap{position:relative}
#langbtn{
  display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:99px;
  padding:9px 13px 9px 11px;color:var(--dim);transition:.2s;
  background:rgba(0,2,6,.5);backdrop-filter:blur(8px);
  font-family:var(--mono);font-size:9.5px;letter-spacing:.16em
}
#langbtn:hover,#langbtn[aria-expanded="true"]{border-color:#fff;color:#fff}
#langbtn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.5;flex:none}
#langmenu{
  position:absolute;bottom:calc(100% + 8px);right:0;min-width:150px;
  background:rgba(2,4,9,.96);backdrop-filter:blur(18px);
  border:1px solid var(--line);border-radius:3px;overflow:hidden;
  box-shadow:0 20px 50px -20px rgba(0,0,0,.95)
}
#langmenu button{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 14px;
  color:var(--dim);transition:background .2s,color .2s;font-size:13px
}
#langmenu button:hover{background:rgba(255,255,255,.06);color:#fff}
#langmenu button[aria-current="true"]{color:#fff}
#langmenu button span.k{
  font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--faint);flex:none;width:20px
}
#langmenu button[aria-current="true"] span.k{color:#3D8BFF}

@media (max-width:620px){
  #crumb{top:18px;left:16px;font-size:9px;letter-spacing:.14em;gap:8px}
  #crumb .trail{display:none}
  #cornerIn{right:14px;bottom:16px;gap:8px}
  #say{padding:9px 13px;font-size:9px;letter-spacing:.16em}
  #langbtn{padding:8px 11px 8px 10px;font-size:9px}
  #title{top:22px}
  #title h1{font-size:20px;letter-spacing:.1em}
  #title .pf{font-size:11px;letter-spacing:.3em;margin-top:8px}
  #social{margin-top:14px;gap:14px}
  #social a{width:30px;height:30px}
  #social svg{width:19px;height:19px}
  #win{width:94vw;max-height:86vh}
  #winBody{padding:22px 20px 30px}
  #winBody p,#winBody li{font-size:14px}

internly: {
  role:'Eingestellt · eine Plattform, die Schüler mit Praktika verbindet',
  body:"Letztes Jahr hatte ich die geniale Idee, Schüler mit Praktika zu verbinden.\n\nDu würdest jetzt wahrscheinlich sagen: „Schöne Idee, aber wie? Ein Praktikum zu bekommen ist doch einfach.“ Nein, das stimmt nicht, jedenfalls nicht in Deutschland. Es ist unglaublich schwer, das richtige, spannende Praktikum zu finden, das alle wollen.\n\nAlso habe ich eine Website gebaut, auf der coole Unternehmen Praktika anbieten konnten. Die Schüler mussten nur ein paar Basisdaten eingeben — E-Mail, Telefonnummer — Datum und Dauer auswählen und auf „Bewerben“ klicken. So einfach war das. Keine Suche nach der richtigen E-Mail-Adresse, kein Lebenslauf, kein Stress mit Dingen, die egal sind.\n\nEs war genial. Aber ich konnte es nicht allein stemmen. Ich habe so viel Zeit in die Plattform, das Marketing und das ganze Projekt gesteckt. Irgendwann habe ich es abgeschaltet, weil ich angefangen habe zu reisen und andere Projekte zu bauen.\n\nEs war eine unglaublich wertvolle Lektion.",

henri: {
  title:'WER ICH BIN', role:'18 · Coesfeld, Deutschland · Abitur 2027',
  body:"Hey, ich bin Henri – ein kreativer Kopf mit der Leidenschaft, Ideen lebendig zu machen.\n\nOb Videos schneiden, Momente fotografieren, digitale Räume gestalten oder ganze Content-Strategien entwerfen – ich liebe es, Erlebnisse zu schaffen, die hängen bleiben, Sinn ergeben und auf ihre eigene Art herausstechen.\n\nIch passe nicht sauber in eine Schublade. Manchmal bin ich tief im kreativen Flow, manchmal voll auf das Reisen konzentriert. Ich arbeite gern an Projekten vom ersten Funken bis zum letzten Schliff – nicht nur an der Optik, sondern auch an der Wirkung, der Stimmung und dem Gefühl dahinter.\n\nWas mich ausmacht? Ich verbinde Dinge – Menschen, Ideen, Bilder und Geschichten. Ich denke visuell, ich fühle in Atmosphären und Details, und ich arbeite allein genauso gut wie im Team. Zusammenarbeit gibt mir Energie, und ich lerne gern von anderen.\n\nMich inspirieren Gegensätze – zwischen analog und digital, alter Schule und modernen Werkzeugen. Ich renne keinen Trends hinterher. Ich baue Räume, die sich für mich richtig anfühlen. Und ich glaube daran, durch Machen zu lernen, nicht durchs Warten auf Erlaubnis.\n\nDiese Seite zeigt, wie ich denke: neugierig, praktisch und immer in Bewegung.",

  metric:['5000+','seguidores'],
  body:"Llevo las redes de un agente inmobiliario en dos cuentas: su marca personal y la oficina de FALC Immobilien Coesfeld. Las dos empezaron de cero. Juntas ya pasan de 5.000 seguidores.\n\nNunca se trató del alcance por sí mismo. Se trataba de crear autenticidad, una persona en la que la gente pudiera confiar. El trabajo consiste en hacer visible esa confianza: enseñar el trabajo, enseñar los inmuebles, enseñar a la persona. Y después ponérselo fácil a quien quiera dar el paso.",

klostermann: {
  role:'Vídeo de campaña política · Instagram y TikTok',
  body:"Le escribí un correo en frío a un candidato a la alcaldía preguntándole si podía promocionar su campaña. Dijo que sí. Dos días después grabamos muchos vídeos sobre sus posiciones políticas.\n\nLa campaña no es como el trabajo de marca: hay un objetivo concreto, y el vídeo en sí no vale nada si no da resultados.\n\nPerdió las elecciones. 48 % contra 52 %. Es una historia triste pero real, y aun así creo que le ayudé.",

abenteuer: {

  metric:['12/12','meses de 2025 grabados'],
  body:"Desde pequeño siempre he querido viajar. En realidad es carísimo conocer sitios que no has visto nunca. Aun así me propuse salir de aventura cada mes de 2025, y lo conseguí.\n\nCreé una cuenta pequeña de TikTok sobre mis viajes, pero puse muchos vídeos en privado porque recibí odio por ellos. Ahora lo veo como un aprendizaje positivo. Por eso vuelvo a grabar mis viajes, mi camino en la fotografía analógica, la naturaleza y lo que he aprendido.",

video: {
  title:'CÓMO SE HACE',
  role:'Cómo se hacen realmente los vídeos',
  metric:['?','¿Cómo se hacen vídeos virales?'],
  body:"¿Alguna vez te has preguntado cómo funcionan los vídeos virales?\n\nOjalá pudiera decírtelo, pero en realidad depende.\n\nDepende del público al que quieras llegar.\n\nSí, claro que podría hacerte un vídeo viral con millones de visualizaciones en pocos días. Pero eso no es lo que quieres. Deberías centrarte en tu público y en la autenticidad. La realidad es que ese tipo de vídeos se apoya muchas veces en el odio o en información engañosa sobre tu negocio, tu empresa o tu persona.\n\nEl vídeo debe hablar por sí mismo. Debe ser auténtico, repetible, informativo y, en general, agradable de ver.\n\nPuedo ayudarte a publicar, crear y montar vídeos auténticos y repetibles que tu público disfrute de verdad.\n\nY por favor no olvides el gancho. Es literalmente lo primero que ve tu público, así que los primeros segundos tienen que engancharle.",

'floh-social': {
  role:'Nuestro propio mercadillo · Instagram desde cero',
  metric:['250K+','visualizaciones en un mes'],
  body:"Montamos la cuenta de Instagram de nuestro propio mercadillo desde cero. En un mes: 40 vídeos, más de 250.000 visualizaciones y más de 1.900 seguidores nuevos.\n\nSin presupuesto y sin anuncios. Nos grabamos a nosotros, a los patrocinadores, a la ciudad y a los puestos, y publicamos casi a diario hasta que todo Coesfeld conocía la fecha.\n\nEso es lo que la gente subestima de un evento local: el evento no es el trabajo. Conseguir que 70 familias se apunten como vendedores y que la ciudad aparezca un domingo por la mañana, eso sí es el trabajo, y ocurre en el móvil.",

  did:['40 vídeos en un mes, grabados y montados por nosotros',

       'Sorteos con más de 30 patrocinadores locales para empujar el alcance',

flohmarkt: {
  role:'Cofundador · mercadillo de barrio · marketing',
  metric:['250K+','visualizaciones · 1.900 seguidores nuevos en un mes'],
  body:"¿Por qué comprar cosas por internet si puedes comprarlas de segunda mano por menos?\n\nEsa es la pregunta que nos hicimos. Pero en Coesfeld, mi ciudad, todos los mercadillos son horribles. Venden sobre todo productos nuevos de China a precios espantosos. Lo odiamos.\n\nAsí que decidí organizar mi propio mercadillo en Coesfeld, y un compañero de clase se apuntó. Lo hicimos todo nosotros: marketing, prensa, programación, organización, ventas y repartir folletos.\n\nTrabajamos con más de 30 patrocinadores locales en Instagram que apoyaron la idea. Juntos organizamos sorteos con premios por valor de más de 3.000 € para los visitantes. La idea era fortalecer la economía local, animar a la gente a venir al mercadillo e invitarla a comprar de segunda mano en vez de nuevo.\n\nLa cuenta de Instagram ganó más de 1.900 seguidores en un solo mes, y nuestros vídeos superaron las 250.000 visualizaciones.\n\nTambién creamos una web interactiva con un mapa de puestos. Los vendedores podían registrar su puesto, indicar qué vendían y aparecer directamente en el mapa. Así los visitantes veían todos los puestos y planificaban su propia ruta por el mercadillo.",
  extra:{ title:'La web · coesfeldflohmarkt.de',
    body:"En mayo se me ocurrió la brillante idea de montar un mercadillo. Así que lo hice a lo grande.\n\nEn un mercadillo normal tienes algunos visitantes y algunos vendedores, pero nunca basta para que todo el mundo se entere de que se celebra. Así que pensé que hacía falta una innovación.\n\n24 horas después: abrí Figma y lo diseñé. El resto lo hizo Claude, conectado a GitHub, Supabase, un proveedor de dominios y demás.\n\nLa web tenía un mapa de puestos interactivo. Podías registrarte como vendedor, indicar el sitio delante de tu casa y quedar marcado en el mapa. Todo el mundo veía la marca y sabía dónde estaba tu puesto. La ventaja: más gente se enteraba del mercadillo y los visitantes podían planificar su ruta.\n\nMás de 10.000 visitantes en la web. Además hicimos muchos sorteos con comercios locales y tuvimos más de 2.600 participantes que querían ganar algo. Quien ganaba tenía que visitar el mercadillo para recoger su premio." },
  didTitle:'Lo que hicimos',
  did:['Fundamos un mercadillo',
       'Programamos la web entera — más de 10.000 visitantes',
       'Colaboramos con más de 30 patrocinadores',
       'Redes: 40 vídeos, 250.000 visualizaciones y más de 1.900 seguidores nuevos en un mes',
       'Gestionamos folletos, prensa y varios cientos de mensajes de vendedores primerizos'],

/* ---------- rebuild every object for the chosen language ---------- */
function applyLang(){
  const pack = TR[LANG] || null;

  FOLDERS.forEach((f,i)=>{
    const src = SRC.folders[i];
    f.name = src.name; f.sub = src.sub; f.proof = src.proof;
    const o = pack && pack.folders && pack.folders[f.id];
    if (o){ if (o.name!=null) f.name=o.name; if (o.sub!=null) f.sub=o.sub; if (o.proof!=null) f.proof=o.proof; }
    (f.subs||[]).forEach((s,j)=>{
      const ssrc = src.subs[j];
      s.name = ssrc.name; s.proof = ssrc.proof;
      const so = pack && pack.subs && pack.subs[s.id];
      if (so){ if (so.name!=null) s.name=so.name; if (so.proof!=null) s.proof=so.proof; }
    });
  });

  ITEMS.forEach(it=>{
    const src = SRC.items.find(x=> x.id === it.id);
    if (!src) return;                       // photos injected from media.json — left alone
    ['title','role','body','didTitle'].forEach(k=>{ if (src[k]!=null) it[k]=src[k]; });
    if (src.metric) it.metric = src.metric.slice();
    if (src.did)    it.did    = src.did.slice();
    if (src.tags)   it.tags   = src.tags.slice();
    if (src.quote)  it.quote  = { t:src.quote.t, a:src.quote.a };
    if (src.extra)  it.extra  = { title:src.extra.title, body:src.extra.body };
    if (src.links)  it.links  = src.links.map(l=> ({u:l.u, t:l.t}));

    const o = pack && pack.items && pack.items[it.id];
    if (!o) return;
    ['title','role','body','didTitle'].forEach(k=>{ if (o[k]!=null) it[k]=o[k]; });
    if (o.metric && it.metric) it.metric = o.metric.slice();
    if (o.did)   it.did   = o.did.slice();
    if (o.tags)  it.tags  = o.tags.slice();
    if (o.quote) it.quote = { t:o.quote.t, a:o.quote.a };
    if (o.extra) it.extra = { title:o.extra.title, body:o.extra.body };
    // links keep their addresses; only the visible label is translated
    if (o.links && it.links) o.links.forEach((label,k)=>{ if (it.links[k] && label) it.links[k].t = label; });
  });
}

function setLang(id){
  if (!LANGS.some(l=> l.id === id)) return;
  LANG = id;
  try{ localStorage.setItem('henri.lang', id); }catch(e){}
  document.documentElement.lang = id;
  applyLang();
}

(function pickLang(){
  let want = null;
  try{ want = localStorage.getItem('henri.lang'); }catch(e){}
  if (!want){
    const nav = (navigator.language || 'en').slice(0,2).toLowerCase();
    if (LANGS.some(l=> l.id === nav)) want = nav;
  }
  LANG = want && LANGS.some(l=> l.id === want) ? want : 'en';
  document.documentElement.lang = LANG;
  applyLang();
})();

/* ===================== SPACE ===================== */
function BOOT_SPACE(){
'use strict';

const cv  = document.getElementById('sky');
const ctx = cv.getContext('2d', { alpha:false });
const labelLayer = document.getElementById('folderLabels');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

let W=0, H=0, DPR=1, CX=0, CY=0, FOCAL=900;
const v3 = (x,y,z)=>({x,y,z});
const nrm = v=>{ const l=Math.hypot(v.x,v.y,v.z)||1; return v3(v.x/l,v.y/l,v.z/l); };
const cross = (a,b)=> v3(a.y*b.z-a.z*b.y, a.z*b.x-a.x*b.z, a.x*b.y-a.y*b.x);
const clamp = (v,a,b)=> v<a?a:v>b?b:v;

let _s = 20071019;
const rnd = ()=>{ _s^=_s<<13; _s^=_s>>>17; _s^=_s<<5; return (_s>>>0)/4294967296; };

/* ---------------- stars ---------------- */
const STARS = [];
for (let i=0;i<820;i++){
  const u=rnd()*2-1, th=rnd()*6.2832, s=Math.sqrt(1-u*u), r=1500+rnd()*2800;
  STARS.push({ x:Math.cos(th)*s*r, y:u*r, z:Math.sin(th)*s*r,
               m:0.22+Math.pow(rnd(),3.2)*1.25, tw:rnd()*6.28, ts:0.3+rnd()*1.1 });
}

/* ---------------- camera ---------------- */
const cam = {
  yaw:0, pitch:0.05, dist:1500,
  gyaw:0, gpitch:0.05, gdist:700,
  vyaw:0, vpitch:0, zoom:1,
  drift:0, idle:0
};
let camPos=v3(0,0,0), Rt=v3(1,0,0), Up=v3(0,1,0), Fw=v3(0,0,1);
const HOME = v3(0, 40, 700);           // the direction every object faces at rest

function updateCam(dt){
  const k = reduce ? 1 : 1-Math.pow(0.0022, dt);
  cam.yaw   += (cam.gyaw   - cam.yaw)*k;
  cam.pitch += (cam.gpitch - cam.pitch)*k;
  cam.dist  += (cam.gdist  - cam.dist)*k;
  const cp=Math.cos(cam.pitch), sp=Math.sin(cam.pitch);
  const cyw=Math.cos(cam.yaw), syw=Math.sin(cam.yaw);
  const d = v3(cp*syw, sp, cp*cyw);
  camPos = v3(d.x*cam.dist, d.y*cam.dist, d.z*cam.dist);
  Fw = v3(-d.x,-d.y,-d.z);
  Rt = nrm(cross(Fw, v3(0,1,0)));
  Up = nrm(cross(Rt, Fw));
}

const _p = {x:0,y:0,z:0,s:1,ok:false};
function project(px,py,pz,o){
  const dx=px-camPos.x, dy=py-camPos.y, dz=pz-camPos.z;
  const z = dx*Fw.x+dy*Fw.y+dz*Fw.z;
  if (z < 40){ o.ok=false; return o; }
  const s = FOCAL/z;
  o.x = CX + (dx*Rt.x+dy*Rt.y+dz*Rt.z)*s;
  o.y = CY - (dx*Up.x+dy*Up.y+dz*Up.z)*s;
  o.z = z; o.s = s; o.ok = true;
  return o;
}

/* ---------------- objects ---------------- */
/* kind: 'folder' | 'sheet' */
function makeObj(kind, data){
  return {
    kind, data,
    p: v3(0,0,0), roll: 0, phase: rnd()*6.28, bob: 0.5+rnd()*0.8,
    a: 0, ga: 0,          // alpha, goal alpha
    sc: 0.86, gsc: 1,     // scale
    hot: 0,
    poly: null, cx:0, cy:0, ps:1, vis:false
  };
}

const ALLF = [];
FOLDERS.forEach(f=>{
  ALLF.push(f);
  (f.subs||[]).forEach(sub=>{ sub.parent = f.id; sub.color = f.color; ALLF.push(sub); });
});
const folderObjs = ALLF.map(f => makeObj('folder', f));
const fObjById = {}; folderObjs.forEach(o=> fObjById[o.data.id] = o);
const fById = {}; ALLF.forEach(f=> fById[f.id] = f);
let sheetObjs  = ITEMS.map(it => makeObj('sheet', it));
sheetObjs.forEach(o=>{ const f = fById[o.data.f]; o.col = (f && f.color) || '#ffffff'; });
/* ITEMS can grow later, when media.json lands after the first paint */
function rebuildObjects(){
  sheetObjs = ITEMS.map(it => makeObj('sheet', it));
  sheetObjs.forEach(o=>{ const f = fById[o.data.f]; o.col = (f && f.color) || '#ffffff'; });
}
const tvObjs = (typeof TVS !== 'undefined' ? TVS : []).map(t => makeObj('tv', t));
tvObjs.forEach(o=>{ const f = fById[o.data.f]; o.col = (f && f.color) || '#ffffff'; });
folderObjs.forEach(o=>{ o.col = o.data.color || '#ffffff'; });

/* what sits inside a folder: its sub-folders, or its files */
function childrenOf(id){
  if (!id) return FOLDERS.map(f=> fObjById[f.id]);
  const f = fById[id];
  if (f && f.subs && f.subs.length) return f.subs.map(s=> fObjById[s.id]);
  return sheetObjs.filter(o=> o.data.f === id)
         .concat(tvObjs.filter(o=> o.data.f === id));
}
function countOf(id){
  const f = fById[id];
  if (f && f.subs && f.subs.length) return f.subs.reduce((n,s)=> n + countOf(s.id), 0);
  return ITEMS.filter(i=> i.f === id).length;
}

/* ---------------- layout ---------------- */
let fitDist = 700;
let bandHalf = 0;          // half the height of the free space between header and buttons

function layoutRoot(list){
  const n = list.length;
  if (W >= 860){
    // a loose constellation on a grid — every folder gets its own depth and angle,
    // and enough room underneath for its label
    if (n <= 3){
      const S = n === 2
        ? [[-215,  30,  55],[ 215, -18, -55]]
        : [[-360,  44,  60],[   0, -18, 130],[ 360,  30, -70]];
      list.forEach((o,i)=>{
        const k = S[i % S.length];
        o.p = v3(k[0], k[1], k[2]);
        o.yaw = [0.26,-0.24,-0.10][i%3]; o.pitch = [-0.07,0.06,0.11][i%3]; o.roll = [-0.03,0.028,0.035][i%3];
      });
    } else {
      const cols = n <= 4 ? 2 : 3;
      const rows = Math.ceil(n/cols);
      const cellW = 470, cellH = 395;
      const Z    = [-215, -60, -265, 125, -25, -305, 60, -180];
      const YAW  = [ 0.30,-0.06,-0.32, 0.24, 0.04,-0.26, 0.18,-0.20];
      const PIT  = [-0.11,-0.13, 0.09, 0.12, 0.15,-0.08, 0.05, 0.10];
      const RL   = [-0.04, 0.03,-0.02, 0.04,-0.03, 0.025,-0.03, 0.02];
      list.forEach((o,i)=>{
        const row = Math.floor(i/cols), col = i%cols;
        const inRow = Math.min(cols, n - row*cols);
        o.p = v3((col - (inRow-1)/2)*cellW, ((rows-1)/2 - row)*cellH, Z[i%8]);
        o.yaw = YAW[i%8]; o.pitch = PIT[i%8]; o.roll = RL[i%8];
      });
    }
  } else {
    // On a phone an even grid reads as a grid. Every folder sits at the SAME
    // depth, so they are all the same size and every label lands on the same
    // line — the tilt is what keeps them three-dimensional, not the distance.
    const short = H < 660;
    const cols = 2, cw = 176, ch = short ? 212 : 246;
    list.forEach((o,i)=>{
      const row = Math.floor(i/cols), col = i%cols;
      const rowCount = Math.min(cols, n - row*cols);
      o.p = v3((col - (rowCount-1)/2) * cw, ((Math.ceil(n/cols)-1)/2 - row) * ch, 0);
      o.yaw = (col ? -1 : 1) * 0.13; o.pitch = 0.05; o.roll = (col ? -1 : 1) * 0.015;
    });
  }
  // cap how large a folder may get, so a level with only two of them stays calm
  const fhw = W>=860 ? 106 : 62;
  const maxPx = W>=860 ? 360 : W*0.44;
  // the second number is the vertical half-extent of one cell INCLUDING its
  // label, so the outer rows never get pushed off the screen
  const labelAllow = W>=860 ? 184 : (H < 660 ? 102 : 132);
  fitDist = fitFor(list, W>=860 ? 122 : 78, labelAllow, 2*fhw*FOCAL/maxPx);
}

function layoutSheets(list){
  const n = list.length;
  const small = W < 700;
  const photos = list.length && list.every(o=> o.data && o.data.img);

  if (photos){
    // A wall of pictures. Every cell is the same size and every picture is
    // fitted INSIDE its cell at its own shape, so nothing can ever overlap
    // however tall or wide the photo is.
    // choose the column count from the shape of the SCREEN, so the wall fills it
    // instead of leaving half the width empty
    const aspect = (W*0.91) / Math.max(1, H*0.82);
    let cols = Math.round(Math.sqrt(n * aspect));
    cols = clamp(cols, small ? 3 : 5, small ? 5 : 12);
    cols = Math.min(cols, n);
    const rows = Math.ceil(n/cols);
    const cell = small ? 108 : 132;                 // half-size of one cell
    const gap  = small ? 18 : 24;
    const cw = 2*cell + gap, ch = 2*cell + gap;
    list.forEach((o,i)=>{
      const row = Math.floor(i/cols), col = i%cols;
      const inRow = Math.min(cols, n - row*cols);
      o.p = v3((col - (inRow-1)/2) * cw, ((rows-1)/2 - row) * ch, ((i*29)%5 - 2) * 4);
      o.roll = 0; o.yaw = 0; o.pitch = 0;
      o.cell = cell;
    });
    fitDist = fitFor(list, cell + gap*0.5, cell + gap*0.5, 0);
    return;
  }

  const cols = small ? 2 : (n<=4 ? 2 : (n<=6 ? 3 : 4));
  const rows = Math.ceil(n/cols);
  const hw = small ? 76 : 92, hh = small ? 60 : 62;
  const hasTV = list.some(o=> o.kind === 'tv');   // the aerial and feet need headroom
  const cw = 2*hw + (small ? 30 : 54) + (hasTV ? (small ? 16 : 26) : 0);
  const ch = 2*hh + (small ? 34 : 58) + (hasTV ? (small ? 26 : 38) : 0);
  list.forEach((o,i)=>{
    const row = Math.floor(i/cols), col = i%cols;
    const inRow = Math.min(cols, n - row*cols);
    o.p = v3((col - (inRow-1)/2) * cw, ((rows-1)/2 - row) * ch, ((i*37)%5 - 2) * 5);
    o.roll = 0; o.yaw = 0; o.pitch = 0;
  });
  // never let a small folder magnify its files into billboards
  const maxCardPx = small ? W*0.44 : 290;
  fitDist = fitFor(list, hw + 14, hh + 16, 2*hw*FOCAL/maxCardPx);
}

/* push the camera back until every object — at its own depth — sits inside the frame */
function fitFor(list, hw, hh, minDist){
  let d = Math.max(380, minDist || 380);
  const mx = W*0.455;
  const my = Math.max(60, (bandHalf || H*0.40) - (W<860 ? 10 : 26));
  for (let pass=0; pass<60; pass++){
    let ok = true;
    for (const o of list){
      const dist = Math.max(120, d - o.p.z);
      if ((Math.abs(o.p.x)+hw)*FOCAL/dist > mx || (Math.abs(o.p.y)+hh)*FOCAL/dist > my){ ok = false; break; }
    }
    if (ok) return clamp(d, 380, 4000);
    d *= 1.05;
  }
  return clamp(d, 380, 4000);
}

/* ---------------- geometry ---------------- */
function basis(o){
  // a file is a billboard — it always squarely faces the viewer, so its text
  // is never skewed, never rotated and never overlaps its neighbour
  if (o.kind === 'sheet' || o.kind === 'tv') return [Rt, Up, v3(-Fw.x,-Fw.y,-Fw.z)];
  const sw = reduce ? 0 : Math.sin(time*0.13 + o.phase);
  const sw2 = reduce ? 0 : Math.sin(time*0.097 + o.phase*1.7);
  const yaw   = (o.yaw||0)   + sw*0.19;
  const pitch = (o.pitch||0) + sw2*0.10;
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const N = nrm(v3(Math.sin(yaw)*cp, sp, Math.cos(yaw)*cp));
  let U = nrm(cross(v3(0,1,0), N));
  let V = nrm(cross(N, U));
  const r = o.roll + (reduce ? 0 : sw2*0.03), c = Math.cos(r), s = Math.sin(r);
  return [ v3(U.x*c+V.x*s, U.y*c+V.y*s, U.z*c+V.z*s),
           v3(V.x*c-U.x*s, V.y*c-U.y*s, V.z*c-U.z*s),
           N ];
}

function pt(o, U, V, x, y, out, z, N){
  const k = o.sc;
  const amp = (o.kind === 'sheet' || o.kind === 'tv') ? 0.42 : 1;
  const bobY = reduce ? 0 : Math.sin(time*0.26*o.bob + o.phase)*9*amp;
  const bobX = reduce ? 0 : Math.cos(time*0.19*o.bob + o.phase*1.3)*6*amp;
  const dz = z ? z*k : 0;
  const nx = N ? N.x*dz : 0, ny = N ? N.y*dz : 0, nz = N ? N.z*dz : 0;
  return project(o.p.x + bobX + U.x*x*k + V.x*y*k + nx,
                 o.p.y + bobY + U.y*x*k + V.y*y*k + ny,
                 o.p.z          + U.z*x*k + V.z*y*k + nz, out);
}

const FOLDER_PATH = (hw,hh)=>[
  [-hw,-hh],[hw,-hh],[hw,hh],[-hw+62,hh],[-hw+50,hh+19],[-hw,hh+19]
];

/* ---------------- state ---------------- */
/* the root is a space you fly around; inside a folder you are reading, so it barely tilts */
let YAWLIM = 1.15, PITCHLIM = 0.78, ZOOMIN = 0.55;
let time = 0, state = 'root', openFolder = null, hover = null;
let visible = [];

function setLevel(folderId){
  openFolder = folderId;
  state = folderId ? 'folder' : 'root';
  const kids = childrenOf(folderId);
  const asFolders = kids.length && kids[0].kind === 'folder';
  if (asFolders) layoutRoot(kids); else layoutSheets(kids);
  folderObjs.forEach(o=>{ o.ga=0; o.gsc=0.8; o.delay=0; });
  sheetObjs.forEach(o=>{ o.ga=0; o.gsc=0.8; o.delay=0; });
  tvObjs.forEach(o=>{ o.ga=0; o.gsc=0.8; o.delay=0; });
  kids.forEach((o,i)=>{ o.ga=1; o.gsc=1; o.a=0; o.sc=0.8; o.delay = i*(asFolders?0.06:0.035); });
  visible = kids;
  const readingFiles = kids.length && kids[0].kind === 'sheet';
  const wall = kids.length > 12 && kids.every(o=> o.data && o.data.img);
  YAWLIM   = wall ? 0.62 : (readingFiles ? 0.26 : 1.15);
  PITCHLIM = wall ? 0.42 : (readingFiles ? 0.17 : 0.78);
  ZOOMIN   = wall ? 0.30 : 0.55;                  // how far you may push in
  cam.zoom = 1; cam.gdist = fitDist;
  cam.gyaw = 0; cam.gpitch = 0.05; cam.vyaw = 0; cam.vpitch = 0;
  hover = null;
}

/* ---------------- drawing ---------------- */
const P0={x:0,y:0,z:0,s:1,ok:false}, PT=[];
for (let i=0;i<8;i++) PT.push({x:0,y:0,z:0,s:1,ok:false});

function strokePoly(pts, n){
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i=1;i<n;i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();
}

function drawFolder(o){
  const [U,V,N] = basis(o);
  const small = W < 860;
  const hw = small ? 62 : 106, hh = small ? 48 : 76, dep = small ? 12 : 34;
  const fh = hh * 0.70;                       // the front panel sits lower than the back

  // back panel, with the tab
  const back = [[-hw,-hh],[hw,-hh],[hw,hh],[-hw+0.70*hw,hh],[-hw+0.56*hw,hh+hh*0.30],[-hw,hh+hh*0.30]];
  const B = [];
  let ok = true;
  for (let i=0;i<back.length;i++){
    const q = {x:0,y:0,z:0,s:1,ok:false};
    pt(o,U,V,back[i][0],back[i][1],q,0,N);
    if (!q.ok) ok=false; B.push(q);
  }
  // front panel, pushed toward the viewer
  const front = [[-hw,-hh],[hw,-hh],[hw,fh],[-hw,fh]];
  const F = [];
  for (let i=0;i<4;i++){
    const q = {x:0,y:0,z:0,s:1,ok:false};
    pt(o,U,V,front[i][0],front[i][1],q,dep,N);
    if (!q.ok) ok=false; F.push(q);
  }
  if (!ok){ o.vis=false; return; }
  pt(o,U,V,0,0,P0,dep*0.5,N);
  o.cx=P0.x; o.cy=P0.y; o.ps=P0.s; o.vis=true;
  o.polys = [ B.map(q=>[q.x,q.y]), F.map(q=>[q.x,q.y]) ];

  const a = o.a, hot = o.hot;
  const lw = Math.min(1.9, Math.max(0.75, P0.s*1.1));
  ctx.lineJoin = 'round';

  // back panel — the same colour, pushed down, so the depth reads without a hole
  ctx.beginPath();
  ctx.moveTo(B[0].x,B[0].y);
  for (let i=1;i<B.length;i++) ctx.lineTo(B[i].x,B[i].y);
  ctx.closePath();
  const gBack = ctx.createLinearGradient(B[5].x, B[5].y, B[0].x, B[0].y);
  gBack.addColorStop(0, tone(o.col, -0.34, a));
  gBack.addColorStop(1, tone(o.col, -0.56, a));
  ctx.fillStyle = gBack;
  ctx.fill();
  ctx.strokeStyle = tone(o.col, 0.30 + hot*0.35, (0.9 + hot*0.1)*a);
  ctx.lineWidth = lw; ctx.stroke();

  // the spine, joining front to back at the bottom corners
  ctx.beginPath();
  ctx.moveTo(B[0].x,B[0].y); ctx.lineTo(F[0].x,F[0].y);
  ctx.moveTo(B[1].x,B[1].y); ctx.lineTo(F[1].x,F[1].y);
  ctx.strokeStyle = tone(o.col, 0.10+hot*0.3, (0.8+hot*0.2)*a);
  ctx.lineWidth = lw*0.85; ctx.stroke();

  // front panel — filled solid in the folder's own colour
  ctx.beginPath();
  ctx.moveTo(F[0].x,F[0].y);
  for (let i=1;i<4;i++) ctx.lineTo(F[i].x,F[i].y);
  ctx.closePath();
  const gFront = ctx.createLinearGradient((F[2].x+F[3].x)/2, (F[2].y+F[3].y)/2,
                                          (F[0].x+F[1].x)/2, (F[0].y+F[1].y)/2);
  gFront.addColorStop(0, tone(o.col, 0.20 + hot*0.16, a));
  gFront.addColorStop(1, tone(o.col, -0.16 + hot*0.10, a));
  ctx.fillStyle = gFront;
  ctx.fill();
  ctx.strokeStyle = tone(o.col, 0.52 + hot*0.30, (0.95 + hot*0.05)*a);
  ctx.lineWidth = lw*1.15; ctx.stroke();

  // label, upright in screen space, below the deepest point
  const lowest = Math.max(B[0].y, B[1].y, F[0].y, F[1].y);
  const sz = clamp((small ? 18.4 : 15.2)*P0.s, 1, 130);
  const labelX = small ? Math.round(P0.x) : P0.x;
  let yBase = small ? Math.round(lowest + 22*P0.s) : lowest + 22*P0.s;
  const nItems = countOf(o.data.id);
  if (small){
    o.mobileLabel = {
      x: labelX,
      y: yBase,
      w: Math.max(104, hw*3.1*P0.s),
      nameSize: Math.max(10, sz),
      countSize: Math.max(8.5, 13.4*P0.s),
      name: o.data.name,
      count: nItems + ' ' + (nItems === 1 ? t('item') : t('items')),
      color: o.col,
      alpha: a
    };
    return;
  }
  ctx.textAlign='center'; ctx.textBaseline='top';
  setFont(sz, 500, '0.16em');
  ctx.fillStyle = 'rgba(255,255,255,'+((0.96+hot*0.04)*a).toFixed(3)+')';
  wrap(o.data.name, hw*(small ? 3.1 : 2.3)*P0.s, 2).forEach(ln=>{ ctx.fillText(ln, labelX, yBase); yBase += sz*1.55; });
  setFont(clamp((small ? 13.4 : 11.4)*P0.s, 1, 110), 500, '0.18em');
  ctx.fillStyle = tone(o.col, 0.42, (0.95+hot*0.05)*a);
  ctx.fillText(nItems + ' ' + (nItems === 1 ? t('item') : t('items')), labelX, small ? Math.round(yBase + sz*0.3) : yBase + sz*0.3);
  if (hot > 0.03 && W >= 860 && o.data.proof){
    setFont(clamp(9.5*P0.s, 1, 100), 400, '0.06em');
    ctx.fillStyle = 'rgba(255,255,255,'+(0.85*hot*a).toFixed(3)+')';
    ctx.fillText(o.data.proof, P0.x, yBase + sz*1.85);
  }
}

function drawTV(o){
  const [U,V,N] = basis(o);
  const small = W < 700;
  const hw = small ? 76 : 92, hh = small ? 60 : 62, dep = small ? 9 : 13;
  const AER = 0.34, FT = 0.15;                  // aerial and feet, as a share of the body

  const box = [[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]];
  const F=[], B=[];
  let ok = true;
  for (let i=0;i<4;i++){
    const a={x:0,y:0,z:0,s:1,ok:false}, b={x:0,y:0,z:0,s:1,ok:false};
    pt(o,U,V,box[i][0],box[i][1],a,dep,N); pt(o,U,V,box[i][0],box[i][1],b,-dep,N);
    if (!a.ok || !b.ok) ok=false;
    F.push(a); B.push(b);
  }
  if (!ok){ o.vis=false; return; }
  pt(o,U,V,0,0,P0,dep,N);
  o.cx=P0.x; o.cy=P0.y; o.ps=P0.s; o.vis=true;
  o.polys = [ F.map(q=>[q.x,q.y]) ];

  const a = o.a, hot = o.hot;
  const lw = Math.min(2, Math.max(0.8, P0.s*1.15));
  ctx.lineJoin = 'round';

  // the body, seen slightly from the side
  ctx.beginPath();
  ctx.moveTo(B[0].x,B[0].y); for (let i=1;i<4;i++) ctx.lineTo(B[i].x,B[i].y); ctx.closePath();
  ctx.fillStyle = tone(o.col, -0.70, 0.96*a);
  ctx.fill();
  ctx.strokeStyle = tone(o.col, 0.20+hot*0.3, (0.85+hot*0.15)*a); ctx.lineWidth = lw*0.9; ctx.stroke();
  ctx.beginPath();
  for (let i=0;i<4;i++){ ctx.moveTo(B[i].x,B[i].y); ctx.lineTo(F[i].x,F[i].y); }
  ctx.strokeStyle = tone(o.col, 0.18+hot*0.3, (0.8+hot*0.2)*a); ctx.lineWidth = lw*0.8; ctx.stroke();

  // aerial
  const T1={x:0,y:0,z:0,s:1,ok:false}, T2={x:0,y:0,z:0,s:1,ok:false}, T0={x:0,y:0,z:0,s:1,ok:false};
  pt(o,U,V,0,hh,T0,dep,N);
  pt(o,U,V,-hw*0.40, hh+hh*AER*0.86, T1, dep, N);
  pt(o,U,V, hw*0.28, hh+hh*AER,      T2, dep, N);
  if (T0.ok && T1.ok && T2.ok){
    ctx.beginPath();
    ctx.moveTo(T1.x,T1.y); ctx.lineTo(T0.x,T0.y); ctx.lineTo(T2.x,T2.y);
    ctx.strokeStyle = tone(o.col, 0.45+hot*0.3, (0.95+hot*0.05)*a); ctx.lineWidth = lw*0.9; ctx.stroke();
    ctx.beginPath(); ctx.arc(T1.x,T1.y,Math.max(1.1,P0.s*2.2),0,6.2832);
    ctx.arc(T2.x,T2.y,Math.max(1.1,P0.s*2.2),0,6.2832);
    ctx.fillStyle = tone(o.col, 0.45, (0.95+hot*0.05)*a); ctx.fill();
  }

  // legs
  const L=[[-hw*0.55,-hh],[-hw*0.70,-hh-hh*FT],[hw*0.55,-hh],[hw*0.70,-hh-hh*FT]];
  const LP=[];
  for (let i=0;i<4;i++){ const q={x:0,y:0,z:0,s:1,ok:false}; pt(o,U,V,L[i][0],L[i][1],q,dep,N); LP.push(q); }
  if (LP.every(q=>q.ok)){
    ctx.beginPath();
    ctx.moveTo(LP[0].x,LP[0].y); ctx.lineTo(LP[1].x,LP[1].y);
    ctx.moveTo(LP[2].x,LP[2].y); ctx.lineTo(LP[3].x,LP[3].y);
    ctx.strokeStyle = tone(o.col, 0.40+hot*0.3, (0.95+hot*0.05)*a); ctx.lineWidth = lw*1.2; ctx.stroke();
  }

  // the front frame
  ctx.beginPath();
  ctx.moveTo(F[0].x,F[0].y); for (let i=1;i<4;i++) ctx.lineTo(F[i].x,F[i].y); ctx.closePath();
  const gTv = ctx.createLinearGradient((F[2].x+F[3].x)/2,(F[2].y+F[3].y)/2,(F[0].x+F[1].x)/2,(F[0].y+F[1].y)/2);
  gTv.addColorStop(0, tone(o.col, -0.52 + hot*0.12, 0.97*a));
  gTv.addColorStop(1, tone(o.col, -0.68 + hot*0.10, 0.97*a));
  ctx.fillStyle = gTv;
  ctx.fill();
  ctx.strokeStyle = tone(o.col, 0.50+hot*0.3, (0.97+hot*0.03)*a); ctx.lineWidth = lw*1.25; ctx.stroke();

  // the screen
  const inset = 0.845, ih = 0.70;
  const SC=[[-hw*inset,-hh*ih],[hw*inset,-hh*ih],[hw*inset,hh*ih],[-hw*inset,hh*ih]];
  const SP=[];
  for (let i=0;i<4;i++){ const q={x:0,y:0,z:0,s:1,ok:false}; pt(o,U,V,SC[i][0],SC[i][1],q,dep,N); SP.push(q); }
  if (SP.every(q=>q.ok)){
    ctx.beginPath();
    ctx.moveTo(SP[0].x,SP[0].y); for (let i=1;i<4;i++) ctx.lineTo(SP[i].x,SP[i].y); ctx.closePath();
    ctx.fillStyle = 'rgba(2,6,13,'+(0.85*a).toFixed(3)+')';
    ctx.fill();
    ctx.strokeStyle = tone(o.col, 0.32+hot*0.3, (0.8+hot*0.2)*a); ctx.lineWidth = lw*0.8; ctx.stroke();
    // scan lines
    ctx.save(); ctx.beginPath();
    ctx.moveTo(SP[0].x,SP[0].y); for (let i=1;i<4;i++) ctx.lineTo(SP[i].x,SP[i].y); ctx.closePath(); ctx.clip();
    ctx.strokeStyle = tone(o.col, 0.2, 0.22*a); ctx.lineWidth = Math.max(0.5, P0.s*0.7);
    for (let k=-6;k<=6;k++){
      const y = hh*ih*(k/6.5);
      const p1={x:0,y:0,z:0,s:1,ok:false}, p2={x:0,y:0,z:0,s:1,ok:false};
      pt(o,U,V,-hw*inset,y,p1,dep,N); pt(o,U,V,hw*inset,y,p2,dep,N);
      if (p1.ok&&p2.ok){ ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke(); }
    }
    ctx.restore();
  }

  // play triangle
  const tri=[[-hw*0.10,hh*0.22],[-hw*0.10,-hh*0.22],[hw*0.20,0]];
  const TP=[];
  for (let i=0;i<3;i++){ const q={x:0,y:0,z:0,s:1,ok:false}; pt(o,U,V,tri[i][0],tri[i][1],q,dep,N); TP.push(q); }
  if (TP.every(q=>q.ok)){
    ctx.beginPath();
    ctx.moveTo(TP[0].x,TP[0].y); ctx.lineTo(TP[1].x,TP[1].y); ctx.lineTo(TP[2].x,TP[2].y); ctx.closePath();
    ctx.fillStyle = tone(o.col, 0.40, (0.99)*a); ctx.fill();
  }

  // label, upright, physically proportional — exactly like a folder
  const lowest = Math.max(LP[1].y, LP[3].y, F[3].y, F[2].y);
  const sz = Math.max(0.5, 12.6*P0.s);
  ctx.textAlign='center'; ctx.textBaseline='top';
  setFont(sz, 500, '0.16em');
  ctx.fillStyle = 'rgba(255,255,255,'+((0.97+hot*0.03)*a).toFixed(3)+')';
  ctx.fillText(o.data.title, P0.x, lowest + 20*P0.s);
}

function drawSheet(o){
  const [U,V,N] = basis(o);
  let hw, hh, fd;
  if (o.data.img && o.cell){
    // fit the picture inside its cell, keeping its own proportions
    const ar = o.data.ar || (imgFor(o.data.img).ready ? (imgFor(o.data.img).el.naturalWidth /
                Math.max(1, imgFor(o.data.img).el.naturalHeight)) : 1);
    hw = ar >= 1 ? o.cell : o.cell*ar;
    hh = ar >= 1 ? o.cell/ar : o.cell;
    fd = 0;                                    // no folded corner on a photograph
  } else {
    hw = W<700 ? 76 : 92; hh = W<700 ? 60 : 62; fd = W<700 ? 14 : 18;
  }
  const c = fd
    ? [[-hw,-hh],[hw,-hh],[hw,hh-fd],[hw-fd,hh],[-hw,hh]]
    : [[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh],[-hw,-hh]];
  let ok = true;
  for (let i=0;i<5;i++){ pt(o,U,V,c[i][0],c[i][1],PT[i],0,N); if(!PT[i].ok) ok=false; }
  if (!ok){ o.vis=false; return; }
  pt(o,U,V,0,0,P0,0,N);
  o.cx=P0.x; o.cy=P0.y; o.ps=P0.s; o.vis=true;
  o.polys = [[[PT[0].x,PT[0].y],[PT[1].x,PT[1].y],[PT[2].x,PT[2].y],[PT[3].x,PT[3].y],[PT[4].x,PT[4].y]]];

  const a=o.a, hot=o.hot;
  strokePoly(PT,5);
  // a card is paper, not a hole: a real tint of its folder's colour, dark
  // enough that white text still sits cleanly on top
  const gCard = ctx.createLinearGradient(PT[4].x, PT[4].y, PT[0].x, PT[0].y);
  gCard.addColorStop(0, tone(o.col, -0.74 + hot*0.10, (0.96)*a));
  gCard.addColorStop(1, tone(o.col, -0.86 + hot*0.08, (0.96)*a));
  ctx.fillStyle = gCard;
  ctx.fill();

  // a photo fills the card; the frame is drawn over it
  if (o.data.img){
    const r = imgFor(o.data.img);
    if (r.ready){
      // map the TRUE rectangle of the card, not the folded-corner outline —
      // otherwise the picture comes out sheared
      const TL={x:0,y:0,z:0,s:1,ok:false}, TR={x:0,y:0,z:0,s:1,ok:false}, BL={x:0,y:0,z:0,s:1,ok:false};
      pt(o,U,V,-hw, hh,TL,0,N); pt(o,U,V, hw, hh,TR,0,N); pt(o,U,V,-hw,-hh,BL,0,N);
      if (TL.ok && TR.ok && BL.ok){
        const iw = r.el.naturalWidth || r.el.width, ih = r.el.naturalHeight || r.el.height;
        const cardA = hw/hh, imgA = iw/ih;
        let sx=0, sy=0, sw=iw, sh=ih;
        // the card is already the picture's shape, so nothing is cropped; this
        // only guards against a file whose real shape differs from media.json
        if (Math.abs(imgA - cardA) > 0.01){
          if (imgA > cardA){ sw = ih*cardA; sx = (iw-sw)/2; }
          else             { sh = iw/cardA; sy = (ih-sh)/2; }
        }
        ctx.save();
        strokePoly(PT,5); ctx.clip();
        ctx.globalAlpha = a*(0.72 + hot*0.28);
        ctx.setTransform(DPR,0,0,DPR,0,0);
        ctx.transform(TR.x-TL.x, TR.y-TL.y, BL.x-TL.x, BL.y-TL.y, TL.x, TL.y);
        ctx.drawImage(r.el, sx, sy, sw, sh, 0, 0, 1, 1);
        ctx.restore();
        ctx.setTransform(DPR,0,0,DPR,0,0);
      }
    }
  }
  ctx.strokeStyle = tone(o.col, 0.34+hot*0.3, (0.95+hot*0.05)*a);
  ctx.lineWidth = (1.35 + hot*0.7) * Math.min(1.8, Math.max(0.9, P0.s*1.0));
  ctx.stroke();

  // the folded corner
  pt(o,U,V,hw-fd,hh,PT[5],0,N); pt(o,U,V,hw-fd,hh-fd,PT[6],0,N); pt(o,U,V,hw,hh-fd,PT[7],0,N);
  if (fd && PT[5].ok && PT[6].ok && PT[7].ok){
    ctx.beginPath();
    ctx.moveTo(PT[5].x,PT[5].y); ctx.lineTo(PT[6].x,PT[6].y); ctx.lineTo(PT[7].x,PT[7].y);
    ctx.strokeStyle = tone(o.col, 0.30+hot*0.4, (0.85+hot*0.15)*a);
    ctx.lineWidth = Math.max(1, P0.s*0.9); ctx.stroke();
  }

  const d = o.data;
  const small = W < 700;
  const maxW  = hw*1.74*P0.s;
  if (d.img){
    if (!d.title){                                  // untitled photo: just the picture
      if (hot > 0.05){
        ctx.textAlign='center'; ctx.textBaseline='middle';
        setFont(Math.max(0.5, 8.8*P0.s), 400, '0.24em');
        ctx.fillStyle = 'rgba(255,255,255,'+(0.9*hot*a).toFixed(3)+')';
        ctx.fillText('OPEN', P0.x, P0.y + (hh+16)*P0.s);
      }
      return;
    }
    setFont(10.5, 500, '0.10em');
    const cl = wrap(d.title, hw*1.74, 2);          // measured in card units, so zoom cannot change it
    const cs = Math.max(0.5, 10.5*P0.s);
    setFont(cs, 500, '0.10em');
    ctx.textAlign='center'; ctx.textBaseline='top';
    const ch2 = cl.length*cs*1.45 + 12*P0.s;
    const bottom = Math.max(PT[0].y, PT[1].y);
    ctx.save(); strokePoly(PT,5); ctx.clip();
    ctx.fillStyle = 'rgba(0,1,4,'+(0.62*a).toFixed(3)+')';
    ctx.fillRect(P0.x - hw*1.4*P0.s, bottom - ch2 - 6*P0.s, hw*2.8*P0.s, ch2 + 12*P0.s);
    ctx.restore();
    let cy = bottom - ch2;
    ctx.fillStyle = 'rgba(255,255,255,'+((0.99)*a).toFixed(3)+')';
    cl.forEach(ln=>{ ctx.fillText(ln, P0.x, cy); cy += cs*1.45; });
    ctx.textBaseline='middle';
    if (hot > 0.05){
      setFont(clamp(8.8*P0.s,1,90), 400, '0.24em');
      ctx.fillStyle = 'rgba(255,255,255,'+(0.9*hot*a).toFixed(3)+')';
      ctx.fillText('OPEN', P0.x, P0.y + (hh+18)*P0.s);
    }
    return;
  }
  ctx.textAlign='center'; ctx.textBaseline='top';

  // The line breaks and the shrink factor are worked out ONCE, in the card's own
  // units, and only then scaled to the screen. That way zooming changes nothing
  // but the size — never where a word breaks, never whether the block still fits.
  const bMaxW  = hw*1.74;                       // usable width, in card units
  const bInner = hh*1.74;                       // usable height, in card units
  let bs, bms, lines, bNeed, k = 1;
  for (let pass=0; pass<8; pass++){
    bs = 12.5*k; bms = 22*k;
    setFont(bs, 500, '0.04em');
    lines = wrap(d.title, bMaxW, 3);
    bNeed = lines.length*bs*1.42 + (d.metric ? bs*0.72 + bms : 0);
    if (bNeed <= bInner) break;
    k *= 0.86;
  }
  const sz   = Math.max(0.5, bs*P0.s);
  const ms   = Math.max(0.5, bms*P0.s);
  const need = bNeed*P0.s;

  let y = P0.y - need/2;
  setFont(sz, 500, '0.04em');
  ctx.fillStyle = 'rgba(255,255,255,'+((0.99)*a).toFixed(3)+')';
  lines.forEach(ln=>{ ctx.fillText(ln, P0.x, y); y += sz*1.42; });

  if (d.metric){
    y += sz*0.72;
    setFont(ms, 700, '-0.02em', true);
    ctx.fillStyle = tone(o.col, 0.34, (0.99)*a);
    ctx.fillText(d.metric[0], P0.x, y);
  }
  ctx.textBaseline='middle';

  if (hot > 0.05){
    setFont(clamp(8.8*P0.s,1,90), 400, '0.24em');
    ctx.fillStyle = 'rgba(255,255,255,'+(0.6*hot*a).toFixed(3)+')';
    ctx.fillText('OPEN', P0.x, P0.y + (hh+18)*P0.s);
  }
}

/* ---------------- crisp mobile folder labels ---------------- */
const labelEls = new Map();
function syncFolderLabels(){
  if (!labelLayer) return;
  if (W >= 860 || state !== 'root'){
    labelLayer.replaceChildren();
    labelEls.clear();
    return;
  }
  const active = new Set();
  for (const o of visible){
    if (o.kind !== 'folder' || !o.mobileLabel || o.a < 0.02) continue;
    const id = o.data.id;
    active.add(id);
    let el = labelEls.get(id);
    if (!el){
      el = document.createElement('div');
      el.className = 'folder-label';
      el.innerHTML = '<span class="name"></span><span class="count"></span>';
      labelLayer.appendChild(el);
      labelEls.set(id, el);
    }
    const m = o.mobileLabel;
    const name = el.firstChild, count = el.lastChild;
    if (name.textContent !== m.name) name.textContent = m.name;
    if (count.textContent !== m.count) count.textContent = m.count;
    el.style.transform = 'translate3d(' + Math.round(m.x) + 'px,' + Math.round(m.y) + 'px,0) translateX(-50%)';
    el.style.width = Math.round(m.w) + 'px';
    el.style.opacity = Math.max(0, Math.min(1, m.alpha)).toFixed(3);
    name.style.fontSize = m.nameSize.toFixed(1) + 'px';
    count.style.fontSize = m.countSize.toFixed(1) + 'px';
    count.style.color = tone(m.color, 0.42, 1);
  }
  for (const [id, el] of labelEls){
    if (!active.has(id)){
      el.remove();
      labelEls.delete(id);
    }
  }
}

/* ---------------- images ---------------- */
const IMGS = {};
const IMG_QUEUE = [];
let IMG_ACTIVE = 0;
const IMG_MAX_ACTIVE = 4;
function pumpImages(){
  while (IMG_ACTIVE < IMG_MAX_ACTIVE && IMG_QUEUE.length){
    const r = IMG_QUEUE.shift();
    if (r.loading || r.ready || r.failed) continue;
    r.loading = true;
    IMG_ACTIVE++;
    r.el.onload = ()=>{
      const done = ()=>{ r.ready = true; IMG_ACTIVE--; pumpImages(); };
      if (r.el.decode) r.el.decode().then(done).catch(done);
      else done();
    };
    r.el.onerror = ()=>{ r.failed = true; IMG_ACTIVE--; pumpImages(); };
    r.el.src = r.src;
  }
}
function imgFor(src){
  let r = IMGS[src];
  if (!r){
    r = IMGS[src] = { el: new Image(), src, ready:false, loading:false, failed:false };
    r.el.decoding = 'async';
    IMG_QUEUE.push(r);
    pumpImages();
  }
  return r;
}

/* ---------------- colour ---------------- */
const _rgb = {};
/* mix a hex toward white (k>0) or toward black (k<0) and return rgba() */
function tone(hex, k, a){
  let c = _rgb[hex];
  if (!c){
    const h = hex.replace('#','');
    c = [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
    _rgb[hex] = c;
  }
  const f = v => k >= 0 ? Math.round(v + (255-v)*k) : Math.round(v*(1+k));
  return 'rgba('+f(c[0])+','+f(c[1])+','+f(c[2])+','+Math.max(0,Math.min(1,a)).toFixed(3)+')';
}

function colA(hex, a){
  let c = _rgb[hex];
  if (!c){
    const h = hex.replace('#','');
    c = [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
    _rgb[hex] = c;
  }
  return 'rgba('+c[0]+','+c[1]+','+c[2]+','+Math.max(0,Math.min(1,a)).toFixed(3)+')';
}

/* ---------------- text helpers ---------------- */
let FMONO = "'JetBrains Mono', ui-monospace, monospace";
let FSANS = "'Archivo', 'Helvetica Neue', system-ui, sans-serif";
function setFont(px, weight, spacing, sans){
  ctx.font = weight + ' ' + px.toFixed(1) + 'px ' + (sans ? FSANS : FMONO);
  try { ctx.letterSpacing = spacing; } catch(e){}
}
function wrap(text, maxW, maxLines){
  const words = text.split(' '), out = [];
  let cur = '', i = 0;
  for (; i<words.length; i++){
    const t = cur ? cur+' '+words[i] : words[i];
    if (ctx.measureText(t).width > maxW && cur){ out.push(cur); cur = words[i]; }
    else cur = t;
    if (out.length === maxLines){ cur = ''; break; }
  }
  if (cur) out.push(cur);
  if (i < words.length - 1 && out.length){
    out[out.length-1] = out[out.length-1].replace(/[,;·]?$/, '') + '…';
  }
  return out.slice(0, maxLines);
}

/* ---------------- pick ---------------- */
function inPoly(poly, x, y){
  let inside = false;
  for (let i=0, j=poly.length-1; i<poly.length; j=i++){
    const xi=poly[i][0], yi=poly[i][1], xj=poly[j][0], yj=poly[j][1];
    if (((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) inside = !inside;
  }
  return inside;
}
function pick(mx,my){
  let best=null, bz=-1e9;
  for (const o of visible){
    if (!o.vis || o.a < 0.5 || !o.polys) continue;
    let hit = false;
    for (const p of o.polys) if (inPoly(p, mx, my)) { hit = true; break; }
    if (hit && o.p.z > bz){ best=o; bz=o.p.z; }
  }
  return best;
}

/* ---------------- frame ---------------- */
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  time += dt;

  // did the screen turn out to be something other than what we measured?
  const nowDPR = devicePixelRatio || 1;
  const nowW = innerWidth;
  const nowH = Math.round((window.visualViewport && window.visualViewport.height) || innerHeight);
  if (Math.abs(nowDPR - seenDPR) > 0.01 || nowW !== seenW || Math.abs(nowH - seenH) > 1) resize();

  if (!dragging){
    // let the throw carry on, then settle
    if (Math.abs(cam.vyaw) > 0.00004 || Math.abs(cam.vpitch) > 0.00004){
      const ny = clamp(cam.gyaw + cam.vyaw*(dt*60), -YAWLIM, YAWLIM);
      if (ny === cam.gyaw) cam.vyaw = 0;            // hit the edge — stop there
      cam.gyaw = ny;
      const np = clamp(cam.gpitch + cam.vpitch*(dt*60), -PITCHLIM, PITCHLIM);
      if (np === cam.gpitch) cam.vpitch = 0;
      cam.gpitch = np;
      const decay = Math.pow(0.94, dt*60);
      cam.vyaw *= decay; cam.vpitch *= decay;
      cam.idle = 0;
    } else {
      cam.vyaw = 0; cam.vpitch = 0;
    }
  }
  // pull back in proportion to the real tilt, so reading levels barely move
  cam.gdist = fitDist * cam.zoom * (1 + 0.46*Math.abs(cam.gyaw) + 0.58*Math.abs(cam.gpitch));
  updateCam(dt);

  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle = '#000206';
  ctx.fillRect(0,0,W,H);

  /* stars */
  for (let i=0;i<STARS.length;i++){
    const s = STARS[i];
    project(s.x,s.y,s.z,P0);
    if (!P0.ok || P0.x<-20||P0.x>W+20||P0.y<-20||P0.y>H+20) continue;
    const tw = reduce ? 1 : 0.68+0.32*Math.sin(time*s.ts+s.tw);
    ctx.fillStyle = 'rgba(255,255,255,'+(Math.min(1,s.m*0.8)*tw).toFixed(3)+')';
    ctx.beginPath(); ctx.arc(P0.x,P0.y,Math.max(0.35,s.m*0.95),0,6.2832); ctx.fill();
  }

  /* objects, far to near */
  const all = folderObjs.concat(sheetObjs, tvObjs);
  for (const o of all){
    const dl = o.delay || 0;
    const goal = (o.ga && time - levelAt > dl) ? o.ga : (o.ga ? 0 : 0);
    o.a  += (goal - o.a) * Math.min(1, dt*5.5);
    o.sc += (o.gsc - o.sc) * Math.min(1, dt*5);
    const target = (hover === o) ? 1 : 0;
    o.hot += (target - o.hot) * Math.min(1, dt*11);
    if (o.a < 0.01){ o.vis = false; }
  }
  const draw = all.filter(o=> o.a > 0.01)
                  .map(o=>{ const dz = o.p.x*Fw.x+o.p.y*Fw.y+o.p.z*Fw.z; return {o, dz}; })
                  .sort((a,b)=> b.dz - a.dz);
  for (const d of draw){
    if (d.o.kind === 'folder') drawFolder(d.o);
    else if (d.o.kind === 'tv') drawTV(d.o);
    else drawSheet(d.o);
  }
  syncFolderLabels();

  requestAnimationFrame(frame);
}
let levelAt = 0;

/* ---------------- input ---------------- */
let dragging=false, lx=0, ly=0, moved=false;
cv.addEventListener('pointerdown', e=>{
  cv.setPointerCapture(e.pointerId);
  dragging=true; moved=false; lx=e.clientX; ly=e.clientY;
  cam.vyaw=0; cam.vpitch=0; cam.idle=0; cv.classList.add('drag');
});
cv.addEventListener('pointermove', e=>{
  if (dragging){
    const dx=e.clientX-lx, dy=e.clientY-ly;
    if (Math.abs(dx)+Math.abs(dy) > 4) moved=true;
    cam.gyaw    = clamp(cam.gyaw - dx*0.0042, -YAWLIM, YAWLIM);
    cam.gpitch  = clamp(cam.gpitch + dy*0.0034, -PITCHLIM, PITCHLIM);
    cam.vyaw   = -dx*0.0042; cam.vpitch = dy*0.0034;
    lx=e.clientX; ly=e.clientY; cam.idle=0;
  } else {
    const h = pick(e.clientX, e.clientY);
    if (h !== hover){ hover = h; cv.classList.toggle('point', !!h); }
  }
});
function up(e){
  if (!dragging) return;
  dragging=false; cv.classList.remove('drag');
  if (moved) return;
  const h = pick(e.clientX, e.clientY);
  if (h){
    if (h.kind === 'folder') API.openFolder(h.data.id);
    else if (h.kind === 'tv') API.openTV();
    else API.openItem(h.data.id);
  } else if (state === 'folder'){
    API.back();
  }
}
cv.addEventListener('pointerup', up);
cv.addEventListener('pointercancel', ()=>{ dragging=false; cv.classList.remove('drag'); });
cv.addEventListener('pointerleave', ()=>{ if(!dragging){ hover=null; cv.classList.remove('point'); } });
cv.addEventListener('wheel', e=>{
  e.preventDefault(); cam.idle = 0;
  cam.zoom = clamp(cam.zoom * (1 + Math.sign(e.deltaY)*0.09), ZOOMIN, 1.9);
}, {passive:false});

/* pinch to zoom — a wall of photographs is no use if you cannot get closer */
(function pinch(){
  const pts = new Map();
  let base = 0, baseZoom = 1;
  const dist = ()=>{
    const a = [...pts.values()];
    return a.length < 2 ? 0 : Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y);
  };
  cv.addEventListener('pointerdown', e=>{
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (pts.size === 2){ base = dist(); baseZoom = cam.zoom; }
  });
  cv.addEventListener('pointermove', e=>{
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (pts.size === 2 && base > 0){
      const d = dist();
      if (d > 0){ cam.zoom = clamp(baseZoom * (base/d), ZOOMIN, 1.9); cam.idle = 0; }
    }
  });
  const drop = e=>{ pts.delete(e.pointerId); if (pts.size < 2) base = 0; };
  cv.addEventListener('pointerup', drop);
  cv.addEventListener('pointercancel', drop);
  cv.addEventListener('pointerleave', drop);
})();

/* ---------------- resize ---------------- */
/* What the canvas was last built for. A phone reports its real pixel density
   and its real visible height only once the first paint and the toolbars have
   settled; measure too early and the canvas keeps a small, soft backing store
   until something happens to trigger another resize. So instead of trusting one
   reading, the frame loop watches these three numbers and rebuilds the moment
   any of them turns out to have been wrong. */
let seenDPR = 0, seenW = 0, seenH = 0;
function resize(){
  // innerHeight on iOS Safari reports the layout viewport, which is TALLER than
  // what you can see — the address bar and toolbar sit on top of it. Everything
  // then gets centred against a screen that is ~100px bigger than reality, which
  // is why the folders sat too low with a hole above them. visualViewport is the
  // part actually on screen.
  W = innerWidth;
  H = Math.round((window.visualViewport && window.visualViewport.height) || innerHeight);
  document.documentElement.style.setProperty('--vvh', H + 'px');
  // Render at the screen's real density. The cap exists only so a gigantic
  // window cannot allocate an absurd canvas — and it must NEVER pull us below
  // the screen's own ratio up to 2x, which is the baseline for a crisp line.
  // The old cap of 6.2M pixels did exactly that on a 16" laptop: 1728x1117 at
  // 2x is 7.7M, so it quietly rendered at 1.79x and everything looked soft —
  // until you zoomed to 110%, which shrank the viewport back under the cap.
  const want = Math.min(devicePixelRatio || 1, 3);
  let d = want;
  const MAXPX = 20e6;
  if (W*H*d*d > MAXPX) d = Math.max(Math.min(want, 2), Math.sqrt(MAXPX/(W*H)));
  DPR = Math.max(1, d);
  cv.width = Math.floor(W*DPR); cv.height = Math.floor(H*DPR);
  cv.style.width = W+'px'; cv.style.height = H+'px';
  seenDPR = devicePixelRatio || 1; seenW = W; seenH = H;
  CX = W/2;
  // centre the objects in the gap BETWEEN the header and the bottom row of
  // buttons, instead of nudging the whole scene down by a guessed fraction
  if (state === 'root'){
    const t = document.getElementById('title');
    const top = t ? Math.min(H*0.40, t.getBoundingClientRect().bottom + (W<860 ? 14 : 26)) : H*0.20;
    const bot = H - (W<860 ? 78 : 86);
    CY = (top + bot)/2;
    bandHalf = (bot - top)/2;
  } else {
    CY = H/2;
    bandHalf = H*0.455;
  }
  FOCAL = Math.max(520, Math.min(W,H)*1.12);
  if (visible.length && visible[0].kind === 'folder') layoutRoot(visible);
  else if (visible.length) layoutSheets(visible);
  cam.gdist = fitDist;
}
addEventListener('resize', resize);
addEventListener('load', resize);
addEventListener('orientationchange', ()=> setTimeout(resize, 120));
// the webfont changes every text measurement, so line breaks and the camera fit
// have to be worked out again once it actually arrives
if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize).catch(()=>{});
[60, 300, 900, 2000].forEach(ms=> setTimeout(resize, ms));
if (window.visualViewport){
  visualViewport.addEventListener('resize', resize);
  visualViewport.addEventListener('scroll', resize);   // iOS shrinks it as you scroll
}

/* ---------------- api ---------------- */
const API = {
  state: ()=> state,
  openFolder(){}, openItem(){}, openTV(){}, back(){},   // wired by the UI
  goRoot(){ levelAt = time; setLevel(null); resize(); },
  goFolder(id){ levelAt = time; setLevel(id); resize(); },
  folderOf: id => (ITEMS.find(i=>i.id===id)||{}).f,
  parentOf: id => (fById[id]||{}).parent || null,
  folderMeta: id => fById[id] || null,
  currentFolder: ()=> openFolder,
  clearHover(){ hover = null; cv.classList.remove('point'); },
  refresh(){ rebuildObjects(); levelAt = time; setLevel(openFolder); resize(); }
};
window.SPACE = API;

resize();
levelAt = 0;
setLevel(null);
folderObjs.forEach((o,i)=>{ o.a = 0; o.delay = 0.25 + i*0.11; });
cam.dist = fitDist*2.1;
requestAnimationFrame(frame);
}

/* ===================== UI ===================== */
function BOOT_UI(){
'use strict';
const S = window.SPACE;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const EXT = '<svg viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></svg>';

/* ---------- level state ---------- */
const byId = {}; ITEMS.forEach(i=> byId[i.id]=i);
const folderById = {};
FOLDERS.forEach(f=>{ folderById[f.id]=f; (f.subs||[]).forEach(s=>{ s.parent=f.id; s.color=f.color; folderById[s.id]=s; }); });

let path = [];           // [] = root, ['travel'], ['travel','t2025']
let openId = null;
const level = ()=> path.length ? path[path.length-1] : null;

function setCrumb(){
